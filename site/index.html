<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de lectures</title>
<meta name="description" content="Tous les livres lus depuis 1988, par auteur, par année de lecture et par année de parution.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Shippori+Mincho:wght@600;800&display=swap">
<style>
/* Estampe : papier washi, encre sumi, bleu de Prusse (Hokusai), vermillon du sceau */
:root{
  --washi:#F4ECDA;
  --washi-2:#EADFC6;
  --sumi:#1E1A17;
  --sumi-2:#4A4038;
  --ai:#1C3D63;         /* bleu de Prusse */
  --ai-soft:#DCE3EA;
  --shu:#B3322A;        /* vermillon du sceau */
  --shu-ink:#FFF8EE;
  --kaki:#B08A4A;       /* ocre des nuages */
  --rule:#C9B999;
  --focus:#B3322A;
  --fs:21px;
  /* estampe */
  --e-ciel-haut:#1C3D63; --e-ciel:#F6EEDC; --e-ciel-bas:#EFD9B4;
  --e-fuji:#2F5D8A; --e-fuji-ombre:#1C3D63; --e-neige:#FBF8F0;
  --e-soleil:#C8392E; --e-nuage:#E7CF9E; --e-mer:#1F4B78; --e-mer-2:#2F6A9C;
  --e-ecume:#F7F2E6; --e-bois:#3A2A22; --e-sakura:#EBA9AE; --e-sakura-coeur:#B3322A;
  --e-cadre:#1E1A17;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --washi:#101826; --washi-2:#18243A; --sumi:#F3E9D4; --sumi-2:#C8BDA6;
    --ai:#9FC0E6; --ai-soft:#1F3150; --shu:#E0674F; --shu-ink:#1A0F0C;
    --kaki:#C9A56A; --rule:#34466A; --focus:#F08A6E; color-scheme:dark;
    --e-ciel-haut:#070D18; --e-ciel:#1A2A45; --e-ciel-bas:#2A3553;
    --e-fuji:#35587F; --e-fuji-ombre:#223D5E; --e-neige:#E9E4D6;
    --e-soleil:#E0674F; --e-nuage:#4A4A5E; --e-mer:#16365A; --e-mer-2:#24507C;
    --e-ecume:#DCD6C6; --e-bois:#12100E; --e-sakura:#C98C94; --e-sakura-coeur:#E0674F;
    --e-cadre:#0A0F18;
  }
}
:root[data-theme="dark"]{
  --washi:#101826; --washi-2:#18243A; --sumi:#F3E9D4; --sumi-2:#C8BDA6;
  --ai:#9FC0E6; --ai-soft:#1F3150; --shu:#E0674F; --shu-ink:#1A0F0C;
  --kaki:#C9A56A; --rule:#34466A; --focus:#F08A6E; color-scheme:dark;
    --e-ciel-haut:#070D18; --e-ciel:#1A2A45; --e-ciel-bas:#2A3553;
    --e-fuji:#35587F; --e-fuji-ombre:#223D5E; --e-neige:#E9E4D6;
    --e-soleil:#E0674F; --e-nuage:#4A4A5E; --e-mer:#16365A; --e-mer-2:#24507C;
    --e-ecume:#DCD6C6; --e-bois:#12100E; --e-sakura:#C98C94; --e-sakura-coeur:#E0674F;
    --e-cadre:#0A0F18;
}
:root.grand{--fs:25px}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--washi);color:var(--sumi);
  font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;
  font-size:var(--fs);line-height:1.5;
  touch-action:manipulation;
  padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));
}
.mincho{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding-inline:18px}

/* --- En-tête : cartouche + sceau + vagues seigaiha --- */
header.tete{position:relative;padding-block:18px 0}
.ligne-tete{display:flex;flex-wrap:wrap;align-items:center;gap:14px 16px}
.sceau{
  flex:none;width:64px;height:64px;border-radius:8px;background:var(--shu);color:var(--shu-ink);
  display:grid;place-items:center;font-size:40px;line-height:1;font-weight:800;
  box-shadow:inset 0 0 0 3px var(--shu),inset 0 0 0 5px var(--shu-ink);
}
.cartouche{flex:1 1 0;min-width:0}
.cartouche h1{margin:0;font-size:1.65em;line-height:1.1;font-weight:800;text-wrap:balance}
.cartouche p{margin:4px 0 0;color:var(--sumi-2);font-size:.86em}
.taille{
  margin-left:auto;flex:none;display:flex;align-items:center;gap:8px;min-height:68px;max-width:9.5em;
  padding:6px 12px;border-radius:14px;border:2px solid var(--ai);background:var(--washi-2);color:var(--ai);
  font-weight:700;font-size:.78em;line-height:1.15;text-align:left;
}
.taille .aa{flex:none;font-family:Georgia,serif;font-weight:700;line-height:1;white-space:nowrap}
.taille .aa small{font-size:.7em}
.taille .aa big{font-size:1.45em}
@media (max-width:560px){.taille{flex:1 1 100%;max-width:none;justify-content:center;font-size:.9em}}
.estampe{margin:0 0 18px;padding:7px;background:var(--e-cadre);border-radius:4px;box-shadow:0 2px 0 var(--rule)}
.estampe svg{display:block;width:100%;height:auto;aspect-ratio:600/340;border-radius:1px}
.filet{height:0;border-bottom:3px double var(--sumi);margin-top:18px}

/* --- Titres de section --- */
.titre-vue{display:flex;align-items:baseline;gap:12px;margin:22px 0 6px}
.titre-vue h2{margin:0;font-size:1.35em;line-height:1.2;text-wrap:balance}
.titre-vue .nb{color:var(--sumi-2);font-size:.85em;white-space:nowrap}
.aide{margin:4px 0 16px;color:var(--sumi-2);font-size:.9em;max-width:60ch}

/* --- Gros boutons --- */
.retour{
  display:flex;align-items:center;gap:12px;width:100%;min-height:68px;margin:16px 0 4px;
  padding:0 18px;border-radius:14px;border:2px solid var(--sumi);background:var(--washi-2);
  font-weight:700;text-align:left;
}
.retour svg{flex:none}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px;margin:8px 0 24px}
.tuile{
  min-height:88px;border-radius:14px;border:2px solid var(--ai);background:var(--washi);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;
}
.tuile b{font-size:1.15em;color:var(--ai)}
.tuile span{font-size:.8em;color:var(--sumi-2)}
.tuile.lettre{min-height:76px}
.tuile.lettre b{font-size:1.5em}
.grille.lettres{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}

/* --- Listes de livres (lignes d'encre, pas de cartes) --- */
.livres{list-style:none;margin:0 0 24px;padding:0;border-top:2px solid var(--sumi)}
.livres li{border-bottom:1px solid var(--rule)}
.livre{
  display:block;width:100%;min-height:76px;padding:14px 4px 14px 0;border:0;background:none;text-align:left;
}
.livre .t{display:block;font-size:1.08em;line-height:1.3;font-weight:800}
.livre .a{display:block;color:var(--ai);font-weight:700;margin-top:2px}
.livre .m{display:block;color:var(--sumi-2);font-size:.82em;margin-top:2px}
.auteurs .livre .t{font-weight:700}
.chip{
  display:inline-block;font-size:.72em;font-weight:700;border-radius:999px;padding:2px 12px;margin-left:6px;
  background:var(--shu);color:var(--shu-ink);vertical-align:.12em;
}
.chip.ai{background:var(--ai);color:var(--washi)}

/* --- Recherche --- */
.cherche{display:flex;flex-direction:column;gap:8px;margin:18px 0 8px}
.cherche label{font-weight:700}
.champ{
  width:100%;min-height:68px;padding:12px 16px;border-radius:14px;border:2px solid var(--sumi);
  background:var(--washi);font-size:1em;
}

/* --- Préférés --- */
.pref{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:10px}
.pref button{
  width:100%;min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 18px;border-radius:14px;border:2px solid var(--rule);background:var(--washi-2);text-align:left;font-weight:700;
}
.pref .n{color:var(--shu);font-variant-numeric:tabular-nums;white-space:nowrap}

/* --- Nouveautés --- */
.nouv{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:16px}
.nouv li{border:2px solid var(--sumi);border-radius:14px;padding:16px 18px;background:var(--washi)}
.nouv .t{margin:0;font-size:1.12em;line-height:1.3;font-weight:800}
.nouv .a{margin:2px 0 0;color:var(--ai);font-weight:700}
.nouv .d{margin:6px 0 0;color:var(--sumi-2);font-size:.86em}
.nouv .r{margin:6px 0 0;font-size:.86em}
.nouv .lu{margin-top:12px}

/* --- Rentrée littéraire --- */
.entree{
  display:flex;align-items:center;gap:16px;width:100%;min-height:96px;margin:18px 0 6px;padding:14px 18px;
  border-radius:14px;border:3px solid var(--shu);background:var(--washi-2);text-align:left;
}
.entree .sc{flex:none;width:52px;height:52px;border-radius:6px;background:var(--shu);color:var(--shu-ink);display:grid;place-items:center;font-size:30px;font-weight:800}
.entree b{display:block;font-size:1.08em;line-height:1.25}
.entree span{display:block;color:var(--sumi-2);font-size:.82em}
.entree svg{flex:none;margin-left:auto;color:var(--shu)}
h3.mincho{font-size:1.18em;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--sumi)}
.nouv .res{margin:8px 0 0;font-size:.9em;max-width:60ch}
.chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{margin-left:0}
.connu{margin:8px 0 0;font-size:.86em;font-weight:700;color:var(--shu)}
.selection{list-style:none;margin:0 0 20px;padding:0;border-top:2px solid var(--sumi)}
.selection li{padding:12px 0;border-bottom:1px solid var(--rule)}
.selection .t{display:block;font-weight:800;font-size:1.02em;line-height:1.3}
.selection .a{display:block;color:var(--ai);font-weight:700;font-size:.9em}
.cal{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:10px}
.cal li{display:grid;grid-template-columns:6.8em 1fr;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule)}
.cal .j{font-weight:800;color:var(--shu);font-variant-numeric:tabular-nums}
.cal .fait{color:var(--sumi-2)}
.cal small{display:block;font-size:.86em;color:var(--sumi)}

/* --- Boutons d'action --- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:68px;padding:10px 18px;
  border-radius:14px;border:2px solid var(--ai);background:var(--ai);color:var(--washi);font-weight:700;text-align:center;
}
.btn.clair{background:transparent;color:var(--ai)}
.btn.rouge{background:var(--shu);border-color:var(--shu);color:var(--shu-ink)}
.btn.rouge-clair{background:transparent;border-color:var(--shu);color:var(--shu)}
.pile{display:grid;gap:14px;margin:18px 0}

/* --- Fiche livre et formulaire (plein écran, pas de petite croix) --- */
.fiche{display:grid;gap:6px;margin:10px 0 8px;padding:18px 0;border-top:2px solid var(--sumi);border-bottom:2px solid var(--sumi)}
.fiche h2{margin:0;font-size:1.45em;line-height:1.2;text-wrap:balance}
.fiche .a{margin:0;color:var(--ai);font-weight:700;font-size:1.1em}
.fiche dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:10px 0 0}
.fiche dt{color:var(--sumi-2)}
.fiche dd{margin:0;font-weight:700}
.form{display:grid;gap:22px;margin:12px 0 24px}
.form .f{display:grid;gap:8px}
.form label,.form .lbl{font-weight:700}
.stepper{display:grid;grid-template-columns:76px 1fr 76px;gap:12px;align-items:center}
.stepper button{min-height:76px;border-radius:14px;border:2px solid var(--ai);background:var(--washi-2);color:var(--ai);font-size:1.6em;font-weight:700}
.stepper output{text-align:center;font-size:1.5em;font-weight:800;font-variant-numeric:tabular-nums}
.sugg{display:flex;flex-wrap:wrap;gap:10px}
.sugg button{min-height:60px;padding:8px 16px;border-radius:999px;border:2px solid var(--rule);background:var(--washi-2);font-weight:700}
.case{display:flex;align-items:center;gap:14px;min-height:64px}
.case input{width:36px;height:36px;accent-color:var(--ai)}
.note{padding:14px 16px;border-radius:14px;background:var(--ai-soft);font-size:.9em}
.msg{padding:16px 18px;border-radius:14px;border:2px solid var(--shu);font-weight:700;margin:16px 0}
.vide{padding:22px 0;color:var(--sumi-2)}

/* --- Barre du bas : 4 onglets toujours visibles --- */
nav.onglets{
  position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--washi-2);
  border-top:3px solid var(--sumi);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
}
nav.onglets .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
nav.onglets button{
  min-height:84px;border-radius:12px;border:2px solid transparent;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:.7em;font-weight:700;line-height:1.15;color:var(--sumi-2);padding:4px;
}
nav.onglets button svg{width:32px;height:32px}
nav.onglets button[aria-current="page"]{background:var(--ai);color:var(--washi);border-color:var(--ai)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){ main{animation:app .25s ease-out} @keyframes app{from{opacity:.4}to{opacity:1}} }
</style>

<header class="tete">
  <div class="wrap">
    <figure class="estampe"><svg id="estampe" viewBox="0 0 600 340" role="img" aria-label="Estampe japonaise : le mont Fuji et un soleil rouge au-dessus d'une grande vague, sous une branche de cerisier en fleurs"></svg></figure>
    <div class="ligne-tete">
      <div class="sceau mincho" aria-hidden="true">読</div>
      <div class="cartouche">
        <h1 class="mincho">Mes lectures</h1>
        <p id="sous-titre">Le carnet de Françoise depuis 1988</p>
      </div>
      <button class="taille" id="taille" aria-pressed="false"><span class="aa" aria-hidden="true"><small>A</small><big>A</big></span><span id="taille-txt">Agrandir le texte</span></button>
    </div>
  </div>
  <div class="wrap"><div class="filet"></div></div>
</header>

<main class="wrap" id="vue" tabindex="-1" aria-live="polite"></main>

<nav class="onglets" aria-label="Rubriques">
  <div class="in">
    <button data-tab="lectures" aria-current="page">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="5" y="6" width="22" height="21" rx="2"/><path d="M5 12h22M11 3v6M21 3v6"/></svg>
      Années de lecture</button>
    <button data-tab="auteurs">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="16" cy="11" r="6"/><path d="M5 29c1-6 5.5-9 11-9s10 3 11 9"/></svg>
      Auteurs</button>
    <button data-tab="parution">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 5h14l6 6v16H6z"/><path d="M20 5v6h6M10 17h12M10 22h9"/></svg>
      Années de parution</button>
    <button data-tab="nouveautes">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M16 3l3.6 8 8.4.8-6.4 5.6 2 8.6L16 21.6 8.4 26l2-8.6L4 11.8l8.4-.8z"/></svg>
      Nouveautés</button>
  </div>
</nav>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const vue = $("#vue");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plain = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const ANNEE_COURANTE = new Date().getFullYear();

let data = { livres: [] }, nouv = { maj: "", livres: [] };
let etat = { tab: "lectures", ecran: null, arg: null, q: "" };
let artifact = null, lectureSeule = false, message = "";

/* ---------- L'estampe : Fuji, soleil, grande vague, cerisier ---------- */
function estampe() {
  const v = n => `var(--e-${n})`;
  let o = `<defs>
    <linearGradient id="e-ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${v("ciel-haut")}"/><stop offset=".2" stop-color="${v("ciel-haut")}" stop-opacity=".55"/>
      <stop offset=".42" stop-color="${v("ciel")}"/><stop offset="1" stop-color="${v("ciel-bas")}"/></linearGradient>
    <linearGradient id="e-fuji" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="${v("fuji")}"/><stop offset=".5" stop-color="${v("fuji")}"/><stop offset=".5" stop-color="${v("fuji-ombre")}"/><stop offset="1" stop-color="${v("fuji-ombre")}"/></linearGradient>
    <linearGradient id="e-mer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${v("mer-2")}"/><stop offset="1" stop-color="${v("mer")}"/></linearGradient>
    <clipPath id="e-bas"><rect x="0" y="282" width="600" height="58"/></clipPath>
  </defs>
  <rect width="600" height="340" fill="url(#e-ciel)"/>`;
  // soleil levant
  o += `<circle cx="438" cy="96" r="38" fill="${v("soleil")}"/>`;
  // vol d'oies sauvages
  for (const [x, y, k] of [[360, 62, 1], [380, 74, .8], [398, 58, .9], [344, 80, .7], [414, 70, .7]])
    o += `<path d="M${x} ${y} q${5 * k} ${-5 * k} ${10 * k} 0 q${5 * k} ${-5 * k} ${10 * k} 0" fill="none" stroke="${v("cadre")}" stroke-width="1.8" stroke-linecap="round"/>`;
  // mont Fuji : versants concaves, ombre à droite, neige dentelée
  o += `<path d="M130 262 C205 205 262 142 288 106 L312 106 C338 142 395 205 470 262 Z" fill="url(#e-fuji)"/>
    <path d="M288 106 L312 106 C322 119 331 131 342 145 L331 140 L322 153 L312 140 L302 156 L293 139 L282 150 L276 139 L262 146 C272 132 281 119 288 106 Z" fill="${v("neige")}"/>
    <path d="M300 106 L300 150" stroke="${v("fuji-ombre")}" stroke-width="1" opacity=".35"/>`;
  // bandes de brume dorée (kasumi)
  for (const [x, y, w] of [[-20, 196, 230], [372, 212, 260], [70, 232, 210], [300, 244, 120]])
    o += `<rect x="${x}" y="${y}" width="${w}" height="14" rx="7" fill="${v("nuage")}"/>`;
  // mer lointaine
  o += `<rect x="0" y="258" width="600" height="82" fill="url(#e-mer)"/>`;
  // seigaiha au premier plan
  let sg = "";
  for (let r = 0; r < 4; r++) {
    const y = 266 + r * 16, d = r % 2 ? 18 : 0;
    for (let x = -36 + d; x < 640; x += 36)
      sg += `<circle cx="${x}" cy="${y + 18}" r="18" fill="${v("mer")}" stroke="${v("ecume")}" stroke-width="1.6"/>` +
            `<circle cx="${x}" cy="${y + 18}" r="12" fill="none" stroke="${v("ecume")}" stroke-width="1.2" opacity=".8"/>` +
            `<circle cx="${x}" cy="${y + 18}" r="6" fill="none" stroke="${v("ecume")}" stroke-width="1" opacity=".6"/>`;
  }
  // la grande vague, à gauche, qui s'enroule vers le Fuji
  o += `<path d="M0 340 L0 170 C22 120 78 92 132 104 C176 114 200 148 190 178 C181 162 160 154 142 162 C122 172 124 200 148 222 C176 246 228 258 280 262 C300 263 320 262 344 262 L344 340 Z" fill="${v("mer")}"/>
    <path d="M0 340 L0 196 C26 150 70 130 112 140 C98 156 92 182 110 212 C132 246 190 262 250 270 C286 275 316 278 344 280 L344 340 Z" fill="${v("mer-2")}"/>
    <path d="M12 226 C30 178 64 156 100 158" fill="none" stroke="${v("ecume")}" stroke-width="2" opacity=".7"/>
    <path d="M8 262 C28 214 60 188 96 184" fill="none" stroke="${v("ecume")}" stroke-width="2" opacity=".6"/>
    <path d="M30 296 C50 252 82 226 118 222" fill="none" stroke="${v("ecume")}" stroke-width="2" opacity=".5"/>
    <path d="M132 104 C176 114 200 148 190 178 C184 170 176 164 166 161 C176 150 172 128 150 116 C140 110 130 107 132 104 Z" fill="${v("ecume")}"/>`;
  // griffes d'écume au bout de la crête
  for (const [x, y, a] of [[150, 112, -20], [166, 122, 0], [178, 136, 20], [186, 152, 40], [188, 168, 62], [136, 106, -40], [120, 104, -60]])

  for (const x of [226, 240, 254, 268]) o += `<path d="M${x} 249 l-2 -9 l4 0 Z" fill="${v("cadre")}"/>`;

/* ---------- Données ---------- */
const auteursDe = l => (l.auteur ? l.auteur.split(/\s+(?:&|et)\s+/) : ["Auteur inconnu"]);
const PARTICULES = /^(de|d'|du|des|le|la|van|von|da|di|del|della|mc)$/i;
function cleNom(nom) {
  if (/^(collectif|écrivains|auteur inconnu|les restos)/i.test(nom)) return "~" + nom;
  const m = nom.split(" ");
  if (m.length === 1) return nom;
  let i = m.length - 1;
  while (i > 1 && PARTICULES.test(m[i - 1])) i--;
  const nomFamille = m.slice(i).join(" ").replace(/^(d'|de |du |le |van |da |von )/i, "");
  return nomFamille + " " + m.slice(0, i).join(" ");
}
function lettreDe(nom) { const c = plain(cleNom(nom))[0]; return c && /[a-z]/.test(c) ? c.toUpperCase() : "#"; }
const anneeLecture = l => parseInt(l.lu, 10);
function auteursIndex() {
  const m = new Map();
  for (const l of data.livres) for (const a of auteursDe(l)) { if (!m.has(a)) m.set(a, []); m.get(a).push(l); }
  return m;
}
function metaLivre(l, sans) {
  const p = [];
  if (sans !== "lu") p.push("Lu en " + l.lu);
  if (sans !== "paru") p.push(l.paru ? "Paru en " + l.paru : "Parution inconnue");
  return p.join(" · ");
}
function ligneLivre(l, sans) {
  return `<li><button class="livre" data-nav="livre" data-id="${esc(l.id)}">
    <span class="t mincho">${esc(l.titre)}</span>
    ${sans === "auteur" ? "" : `<span class="a">${esc(l.auteur || "Auteur inconnu")}</span>`}
    <span class="m">${esc(metaLivre(l, sans))}</span></button></li>`;
}
const listeLivres = (ls, sans) => ls.length ? `<ul class="livres">${ls.map(l => ligneLivre(l, sans)).join("")}</ul>` : `<p class="vide">Aucun livre ici.</p>`;
const pluriel = (n, s, p) => n + " " + (n > 1 ? (p || s + "s") : s);
const retour = (txt, nav, arg) => `<button class="retour" data-nav="${nav}"${arg != null ? ` data-arg="${esc(arg)}"` : ""}>
  <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M18 6l-9 9 9 9"/></svg>${esc(txt)}</button>`;
const titre = (t, nb) => `<div class="titre-vue"><h2 class="mincho">${esc(t)}</h2>${nb != null ? `<span class="nb">${esc(nb)}</span>` : ""}</div>`;
const messageHTML = () => message ? `<p class="msg" role="status">${esc(message)}</p>` : "";
const boutonAjout = () => artifact && !lectureSeule ? `<div class="pile"><button class="btn rouge" data-nav="ajout">+ Ajouter un livre lu</button></div>` : "";

/* ---------- Écrans ---------- */
function ecranLectures() {
  if (etat.q.trim()) return ecranRecherche();
  const parAnnee = new Map();
  for (const l of data.livres) { if (!parAnnee.has(l.lu)) parAnnee.set(l.lu, []); parAnnee.get(l.lu).push(l); }
  const annees = [...parAnnee.keys()].sort((a, b) => parseFloat(b) - parseFloat(a));
  return `${messageHTML()}${boutonAjout()}
  ${champRecherche()}
  ${titre("Par année de lecture", pluriel(data.livres.length, "livre"))}
  <p class="aide">Touchez une année pour voir les livres lus cette année-là.</p>
  <div class="grille">${annees.map(a => `<button class="tuile" data-nav="annee" data-arg="${esc(a)}"><b>${esc(a)}</b><span>${pluriel(parAnnee.get(a).length, "livre")}</span></button>`).join("")}</div>`;
}
function champRecherche() {
  return `<div class="cherche"><label for="q">Chercher un titre ou un auteur</label>
  <input class="champ" id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="Par exemple : Modiano" value="${esc(etat.q)}"></div>`;
}
function ecranRecherche() {
  const q = plain(etat.q.trim());
  const res = data.livres.filter(l => plain(l.titre + " " + (l.auteur || "")).includes(q));
  return `${champRecherche()}
  <div class="pile"><button class="btn clair" data-nav="effacer">Effacer la recherche</button></div>
  ${titre("Résultats", pluriel(res.length, "livre"))}${listeLivres(res)}`;
}
function ecranAnnee(a) {
  const ls = data.livres.filter(l => l.lu === a);
  return `${retour("Toutes les années", "tab", "lectures")}${titre("Lus en " + a, pluriel(ls.length, "livre"))}${listeLivres(ls, "lu")}`;
}
function ecranAuteurs() {
  const idx = auteursIndex();
  const pref = [...idx.entries()].filter(([a]) => !a.startsWith("~") && cleNom(a)[0] !== "~")
    .sort((x, y) => y[1].length - x[1].length || cleNom(x[0]).localeCompare(cleNom(y[0]), "fr")).slice(0, 8);
  const lettres = new Map();
  for (const a of idx.keys()) { const L = lettreDe(a); lettres.set(L, (lettres.get(L) || 0) + 1); }
  const Ls = [...lettres.keys()].sort((a, b) => a === "#" ? 1 : b === "#" ? -1 : a.localeCompare(b));
  return `${titre("Auteurs", pluriel(idx.size, "auteur"))}
  <p class="aide">Ses auteurs les plus lus :</p>
  <ul class="pref">${pref.map(([a, ls]) => `<li><button data-nav="auteur" data-arg="${esc(a)}"><span>${esc(a)}</span><span class="n">${pluriel(ls.length, "livre")}</span></button></li>`).join("")}</ul>
  <p class="aide">Ou touchez la première lettre du nom de famille :</p>
  <div class="grille lettres">${Ls.map(L => `<button class="tuile lettre" data-nav="lettre" data-arg="${esc(L)}"><b>${L === "#" ? "Divers" : L}</b></button>`).join("")}</div>`;
}
function ecranLettre(L) {
  const idx = auteursIndex();
  const as = [...idx.keys()].filter(a => lettreDe(a) === L).sort((x, y) => cleNom(x).localeCompare(cleNom(y), "fr"));
  return `${retour("Toutes les lettres", "tab", "auteurs")}${titre(L === "#" ? "Divers" : "Lettre " + L, pluriel(as.length, "auteur"))}
  <ul class="pref">${as.map(a => `<li><button data-nav="auteur" data-arg="${esc(a)}"><span>${esc(a)}</span><span class="n">${pluriel(idx.get(a).length, "livre")}</span></button></li>`).join("")}</ul>`;
}
function ecranAuteur(a) {
  const ls = (auteursIndex().get(a) || []).slice().sort((x, y) => anneeLecture(x) - anneeLecture(y));
  const n = nouv.livres.filter(x => auteursDe(x).includes(a) && !dejaLu(x));
  return `${retour("Lettre " + lettreDe(a), "lettre", lettreDe(a))}${titre(a, pluriel(ls.length, "livre lu", "livres lus"))}
  ${listeLivres(ls, "auteur")}
  ${n.length ? `${titre("Nouveautés de cet auteur")}<ul class="nouv">${n.map(carteNouveaute).join("")}</ul>` : ""}`;
}
const TRANCHES = [
  ["Avant 1900", 0, 1899], ["1900 à 1949", 1900, 1949], ["1950 à 1979", 1950, 1979], ["Années 1980", 1980, 1989],
  ["Années 1990", 1990, 1999], ["Années 2000", 2000, 2009], ["Années 2010", 2010, 2019], ["Depuis 2020", 2020, 2999]];
function ecranParution() {
  const inconnus = data.livres.filter(l => !l.paru).length;
  return `${titre("Par année de parution")}
  <p class="aide">L'année où le livre est sorti pour la première fois. Touchez une période.</p>
  <div class="grille">${TRANCHES.map(([t, a, b], i) => {
    const n = data.livres.filter(l => l.paru >= a && l.paru <= b).length;
    return n ? `<button class="tuile" data-nav="tranche" data-arg="${i}"><b>${esc(t)}</b><span>${pluriel(n, "livre")}</span></button>` : "";
  }).join("")}${inconnus ? `<button class="tuile" data-nav="tranche" data-arg="x"><b>Date inconnue</b><span>${pluriel(inconnus, "livre")}</span></button>` : ""}</div>`;
}
function ecranTranche(i) {
  let ls, t;
  if (i === "x") { ls = data.livres.filter(l => !l.paru); t = "Date inconnue"; }
  else { const [nom, a, b] = TRANCHES[+i]; t = "Parus : " + nom.toLowerCase(); ls = data.livres.filter(l => l.paru >= a && l.paru <= b); }
  ls.sort((x, y) => (x.paru || 0) - (y.paru || 0) || x.titre.localeCompare(y.titre, "fr"));
  return `${retour("Toutes les périodes", "tab", "parution")}${titre(t, pluriel(ls.length, "livre"))}${listeLivres(ls)}`;
}

/* ---------- Nouveautés ---------- */
const cleTitre = s => plain(s).replace(/[^a-z0-9]/g, "");
const dejaLu = n => data.livres.some(l => cleTitre(l.titre) === cleTitre(n.titre));
function dateNouv(n) {
  const [y, m, d] = (n.date || "").split("-").map(Number);
  if (!m) return String(y);
  return (d ? (d === 1 ? "1er" : d) + " " : "") + MOIS[m - 1] + " " + y;
}
const aVenir = n => (n.date || "") > new Date().toISOString().slice(0, 10);
function carteNouveaute(n) {

    <p class="t mincho">${esc(n.titre)}${aVenir(n) ? `<span class="chip">Bientôt</span>` : ""}</p>

  </li>`;
}
function ecranNouveautes() {
  const ls = nouv.livres.filter(n => !dejaLu(n)).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const bientot = ls.filter(aVenir), sortis = ls.filter(n => !aVenir(n));

    <span><b class="mincho">${esc(nouv.rentree.titre)}</b><span>Les livres dont on parle, les meilleures ventes et les prix</span></span>
    <svg width="28" height="28" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M11 6l9 9-9 9"/></svg></button>` : ""}
  ${titre("De vos auteurs", pluriel(ls.length, "livre"))}
  <p class="aide">Les derniers livres des écrivains que vous avez déjà lus. Liste mise à jour le ${esc(nouv.maj)}.</p>
  ${bientot.length ? `<h3 class="mincho">Bientôt en librairie</h3><ul class="nouv">${bientot.map(carteNouveaute).join("")}</ul>` : ""}
  ${sortis.length ? `<h3 class="mincho">Déjà en librairie</h3><ul class="nouv">${sortis.map(carteNouveaute).join("")}</ul>` : `<p class="vide">Rien de nouveau pour l'instant.</p>`}`;
}

/* ---------- Rentrée littéraire ---------- */
function dateCourte(iso) { const [, m, d] = iso.split("-").map(Number); return (d === 1 ? "1er" : d) + " " + MOIS[m - 1]; }
function carteRentree(l) {
  const idx = auteursIndex(), nb = idx.get(l.auteur)?.length || 0;
  return `<li>
    <p class="t mincho">${esc(l.titre)}</p>

    ${l.prix ? `<div class="chips">${l.prix.map(p => `<span class="chip${p.startsWith("Prix") ? "" : " ai"}">${esc(p.startsWith("Prix") ? p : "Sélection " + p)}</span>`).join("")}</div>` : ""}

function ecranRentree() {

  ${retour("Revenir aux nouveautés", "tab", "nouveautes")}`;

/* ---------- Fiche d'un livre ---------- */
function ecranLivre(id) {
  const l = data.livres.find(x => x.id === id);

/* ---------- Formulaire ajout / correction ---------- */

/* ---------- Rendu et navigation ---------- */
const pileRetour = [];
function rendre(focus) {
  const e = etat.ecran;
  let html;
  if (e === "annee") html = ecranAnnee(etat.arg);
  else if (e === "lettre") html = ecranLettre(etat.arg);
  else if (e === "auteur") html = ecranAuteur(etat.arg);
  else if (e === "tranche") html = ecranTranche(etat.arg);
  else if (e === "livre") html = ecranLivre(etat.arg);
  else if (e === "form") html = ecranForm();
  else if (e === "rentree") html = ecranRentree();
  else html = { lectures: ecranLectures, auteurs: ecranAuteurs, parution: ecranParution, nouveautes: ecranNouveautes }[etat.tab]();
  vue.innerHTML = html;
  document.querySelectorAll("nav.onglets button").forEach(b => {
    if (b.dataset.tab === etat.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  $("#sous-titre").textContent = `Le carnet de Françoise depuis 1988 · ${pluriel(data.livres.length, "livre")}`;
  if (focus !== false) { window.scrollTo(0, 0); vue.focus({ preventScroll: true }); }
}
function aller(ecran, arg) {
  pileRetour.push({ ...etat });
  etat = { ...etat, ecran, arg };
  rendre();
}

/* Anti double-tap : un tremblement ne doit pas déclencher deux navigations */
let dernierTap = 0;
document.addEventListener("click", e => {
  const b = e.target.closest("[data-nav],[data-tab]");
  if (!b) return;
  const t = Date.now();
  if (t - dernierTap < 500) { e.preventDefault(); e.stopImmediatePropagation(); return; }
  dernierTap = t;
}, true);

document.querySelector("nav.onglets").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  message = ""; pileRetour.length = 0; etat = { tab: b.dataset.tab, ecran: null, arg: null, q: "" }; rendre();
});

vue.addEventListener("click", e => {
  const s = e.target.closest("[data-sugg]");
  if (s) { brouillon.auteur = s.dataset.sugg; lireChamps(true); rendre(false); return; }
  const st = e.target.closest("[data-step]");
  if (st) {
    lireChamps();
    const k = st.dataset.step, d = +st.dataset.d;
    if (k === "lu") { brouillon.lu = Math.min(ANNEE_COURANTE, Math.max(1950, brouillon.lu + d)); brouillon.luTexte = null; }
    else brouillon.paru = Math.min(ANNEE_COURANTE + 1, Math.max(1500, (brouillon.paru || ANNEE_COURANTE) + d));
    rendre(false); return;
  }
  const b = e.target.closest("[data-nav]"); if (!b) return;
  const nav = b.dataset.nav, arg = b.dataset.arg;
  if (nav !== "livre") message = "";
  switch (nav) {
    case "tab": pileRetour.length = 0; etat = { tab: arg, ecran: null, arg: null, q: "" }; rendre(); break;
    case "back": etat = pileRetour.pop() || { tab: etat.tab, ecran: null, arg: null, q: "" }; confirmeSuppr = false; rendre(); break;
    case "effacer": etat.q = ""; rendre(); break;
    case "annee": case "lettre": case "auteur": case "tranche": aller(nav, arg); break;
    case "livre": aller("livre", b.dataset.id); break;
    case "rentree": aller("rentree"); break;
    case "ajout": brouillon = nouveauBrouillon(); confirmeSuppr = false; aller("form"); break;
    case "ajout-nouv": { const n = nouv.livres.find(x => x.id === arg); brouillon = nouveauBrouillon(); brouillon.titre = n.titre; brouillon.auteur = n.auteur; brouillon.paru = parseInt(n.date, 10); brouillon.paruConnu = true; confirmeSuppr = false; aller("form"); break; }
    case "modif": brouillon = nouveauBrouillon(data.livres.find(x => x.id === arg)); confirmeSuppr = false; aller("form"); break;
    case "suppr": lireChamps(); confirmeSuppr = true; rendre(false); break;
    case "suppr-non": lireChamps(); confirmeSuppr = false; rendre(false); break;
    case "suppr-ok": supprimer(); break;
  }
});
vue.addEventListener("input", e => {
  if (e.target.id === "q") {
    etat.q = e.target.value;
    const pos = e.target.selectionStart; rendre(false);
    const q = $("#q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (_) {} }
  } else if (e.target.id === "f-auteur") {
    brouillon.auteur = e.target.value;
    const idx = auteursIndex(), q = plain(brouillon.auteur);
    const sugg = q.length >= 2 ? [...idx.keys()].filter(a => plain(a).includes(q) && a !== brouillon.auteur).slice(0, 4) : [];
    $("#sugg").innerHTML = sugg.map(a => `<button type="button" data-sugg="${esc(a)}">${esc(a)}</button>`).join("");
  } else if (e.target.id === "f-titre") brouillon.titre = e.target.value;
});
vue.addEventListener("change", e => {
  if (e.target.id === "f-paru-connu") { lireChamps(); brouillon.paruConnu = e.target.checked; if (brouillon.paruConnu && !brouillon.paru) brouillon.paru = ANNEE_COURANTE; rendre(false); }
});
vue.addEventListener("submit", e => { e.preventDefault(); lireChamps(); enregistrer(); });

function lireChamps(sansAuteur) {
  const t = $("#f-titre"), a = $("#f-auteur");
  if (t) brouillon.titre = t.value;
  if (a && !sansAuteur) brouillon.auteur = a.value;
}

/* ---------- Sauvegarde (le carnet se republie lui-même) ---------- */
async function sauver(nouvellesDonnees, texteOk) {
  const err = $("#f-err");
  try {
    await artifact.publish({ "livres.json": JSON.stringify(nouvellesDonnees, null, 1) });
    data = nouvellesDonnees; message = texteOk;
    pileRetour.length = 0; etat = { tab: "lectures", ecran: null, arg: null, q: "" }; brouillon = null; rendre();
  } catch (x) {
    const c = x && x.code;
    if (c === "conflict") return; // la page se recharge avec la dernière version
    if (["not_writer", "not_granted", "not_declared", "capability_disabled", "consent_required"].includes(c)) {
      lectureSeule = true;
      if (err) { err.hidden = false; err.textContent = "Ce carnet est en lecture seule sur cet appareil. Demandez à la famille de l'ouvrir pour vous."; }
      return;
    }
    if (err) { err.hidden = false; err.textContent = "L'enregistrement n'a pas fonctionné. Vérifiez la connexion internet puis touchez à nouveau le bouton."; }
  }
}
function enregistrer() {
  const b = brouillon, err = $("#f-err");
  const titreL = b.titre.trim(), auteurL = b.auteur.trim().replace(/\s+/g, " ");
  if (!titreL) { err.hidden = false; err.textContent = "Écrivez le titre du livre."; $("#f-titre").focus(); return; }
  const livre = { id: b.id || ("l" + Date.now().toString(36)), titre: titreL, auteur: auteurL || null,
    lu: b.luTexte || String(b.lu), paru: b.paruConnu ? (b.paru || null) : null };
  const livres = b.id ? data.livres.map(l => l.id === b.id ? { ...l, ...livre } : l) : [...data.livres, livre];
  sauver({ ...data, livres }, b.id ? `« ${titreL} » a été corrigé.` : `« ${titreL} » a été ajouté à vos lectures de ${livre.lu}.`);
}
function supprimer() {
  const t = brouillon.titre;
  sauver({ ...data, livres: data.livres.filter(l => l.id !== brouillon.id) }, `« ${t} » a été retiré du carnet.`);
}

/* ---------- Taille du texte (mémorisée sur cet appareil) ---------- */
function appliquerTaille(g) {
  document.documentElement.classList.toggle("grand", g);
  const b = $("#taille"); b.setAttribute("aria-pressed", String(g));
  $("#taille-txt").textContent = g ? "Texte normal" : "Agrandir le texte";
}
let grand = false;
try { grand = localStorage.getItem("texte-grand") === "1"; } catch (_) {}
appliquerTaille(grand);
$("#taille").addEventListener("click", () => { grand = !grand; appliquerTaille(grand); try { localStorage.setItem("texte-grand", grand ? "1" : "0"); } catch (_) {} });

/* ---------- Démarrage ---------- */
estampe();
vue.innerHTML = `<p class="vide">Ouverture du carnet…</p>`;
Promise.all([
  fetch("livres.json").then(r => r.json()),
  fetch("nouveautes.json").then(r => r.json()).catch(() => ({ maj: "", livres: [] }))
]).then(([l, n]) => { data = l; nouv = n; rendre(false); })
  .catch(() => { vue.innerHTML = `<p class="msg">Le carnet n'a pas pu s'ouvrir. Vérifiez la connexion internet puis rechargez la page.</p>`; });

if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("artifact").then(a => { artifact = a; if (a && data.livres.length) rendre(false); }).catch(() => {});
}
})();
</script>
