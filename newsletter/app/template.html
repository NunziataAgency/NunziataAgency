<title>Tri Order & Chaos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
/* Layout : une colonne de cartes cochables, onglets en haut, barre de sélection collée en bas */
:root {
  --bg: #f6f5f1; --surface: #ffffff; --fg: #1c1b19; --muted: #6b6860; --line: #e2dfd6;
  --accent: #1f4ed8; --accent-soft: #e6ecfd; --hot: #b4410f;
  --display: "Fraunces", Georgia, serif; --body: "Instrument Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141413; --surface: #1d1d1b; --fg: #eeece6; --muted: #a29f96; --line: #2f2e2a;
  --accent: #8aa8ff; --accent-soft: #1f2741; --hot: #f08a5d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141413; --surface: #1d1d1b; --fg: #eeece6; --muted: #a29f96; --line: #2f2e2a;
  --accent: #8aa8ff; --accent-soft: #1f2741; --hot: #f08a5d; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
.wrap { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 120px; }
h1 { font: 600 1.5rem/1.2 var(--display); margin: 0 0 4px; text-wrap: balance }
.sub { color: var(--muted); margin: 0 0 16px; font-size: .9rem }
.tabs { display: flex; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 8px; z-index: 2 }
.tab { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 10px 12px; font: 600 .9rem var(--body); cursor: pointer }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.list { display: grid; gap: 10px; margin-top: 8px }
.item { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer }
.item.on { border-color: var(--accent); background: var(--accent-soft) }
.box { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 700; color: var(--bg) }
.item.on .box { background: var(--accent); border-color: var(--accent) }
.meta { display: flex; gap: 8px; align-items: baseline; font-size: .78rem; color: var(--muted); letter-spacing: .02em; font-variant-numeric: tabular-nums }
.id { font-weight: 600; color: var(--fg) }
.score.hi { color: var(--hot); font-weight: 600 }
.t { font-weight: 600; margin: 2px 0 4px; min-width: 0 }
.b { color: var(--muted); font-size: .9rem; min-width: 0; overflow-wrap: anywhere }
.b a { color: var(--accent) }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; z-index: 3 }
.sel { flex: 1; min-width: 0; font: 500 .9rem var(--body); white-space: nowrap; overflow-x: auto; color: var(--muted) }
.sel b { color: var(--fg) }
button.copy { border: 0; background: var(--accent); color: var(--bg); border-radius: 10px; padding: 12px 16px; font: 600 .95rem var(--body); cursor: pointer }
.add { display: grid; gap: 8px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; margin-top: 8px }
.addhead { font-weight: 600 }
.add input[type=url], .add input[type=text] { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 10px; font: 15px var(--body) }
.seg { display: flex; gap: 8px; flex-wrap: wrap }
.seg label { flex: 1; display: flex; gap: 6px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 999px; padding: 8px 10px; cursor: pointer; font-size: .9rem }
.seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); font-weight: 600 }
.addbtn { border: 1px solid var(--fg); background: transparent; color: var(--fg); border-radius: 10px; padding: 10px; font: 600 .95rem var(--body); cursor: pointer }
.date { margin-left: auto }
.lnk { font-size: .8rem; margin-top: 6px; overflow-wrap: anywhere; color: var(--muted) }
.lnk a { color: var(--accent) }
.lnk.none, .lnk.none a { color: var(--hot) }
.tobref { margin-top: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 6px 10px; font: 500 .8rem var(--body); cursor: pointer }
.tobref.on { border-color: var(--accent); color: var(--accent); font-weight: 600 }
.tab { white-space: nowrap; flex: 1 0 auto }
.tabs { overflow-x: auto }
.mine .id { color: var(--accent) }
.del { margin-left: auto; border: 0; background: none; color: var(--muted); font: .8rem var(--body); cursor: pointer; text-decoration: underline }
button:focus-visible, .item:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.views { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 14px }
.view { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 9px; padding: 10px; font: 600 .95rem var(--body); cursor: pointer }
.view[aria-selected="true"] { background: var(--fg); color: var(--bg) }
.sec { font: 600 1.15rem/1.3 var(--display); margin: 22px 0 10px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; min-width: 0 }
.cards { display: grid; gap: 10px }
.status { font-size: .78rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.pill { border-radius: 999px; padding: 2px 8px; font-weight: 600; font-size: .75rem; background: var(--accent-soft); color: var(--accent) }
.pill.warn { background: color-mix(in srgb, var(--hot) 15%, transparent); color: var(--hot) }
.bref { font-size: 1rem; overflow-wrap: anywhere }
.bref a { color: var(--accent) }
.note { font-size: .85rem; color: var(--muted); overflow-wrap: anywhere }
.note a { color: var(--accent) }
.small { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 8px; padding: 7px 10px; font: 600 .85rem var(--body); cursor: pointer; justify-self: start }
.q { cursor: pointer }
.q.on { border-color: var(--accent); background: var(--accent-soft) }
details.doc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px }
details.doc + details.doc { margin-top: 10px }
details.doc summary { cursor: pointer; padding: 12px 0; font-weight: 600; list-style: none }
details.doc summary::after { content: " ▾"; color: var(--muted) }
details.doc[open] summary::after { content: " ▴" }
.md { font-size: .93rem; line-height: 1.55; overflow-wrap: anywhere; padding-bottom: 12px; min-width: 0 }
.md h1 { display: none }
.md h2 { font: 600 1rem var(--body); margin: 18px 0 6px; padding-top: 10px; border-top: 1px solid var(--line) }
.md h3 { font-size: .95rem; margin: 12px 0 4px }
.md ul { padding-left: 18px; margin: 6px 0 }
.md li { margin: 3px 0 }
.md a { color: var(--accent) }
.md table { display: block; overflow-x: auto; border-collapse: collapse; font-size: .85rem }
.md td, .md th { border: 1px solid var(--line); padding: 4px 6px }
.md code { font-size: .85em }
</style>

<div class="wrap">
  <h1>Order & Chaos</h1>
  <p class="sub">__TITLE__</p>
  <div class="views" role="tablist">
    <button class="view" data-v="tri" role="tab">Tri des sujets</button>
    <button class="view" data-v="num" role="tab">Mon numéro</button>
  </div>
  <div id="viewTri">
  <div class="tabs" role="tablist">
    <button class="tab" id="tR" role="tab" data-k="R">Rubriques</button>
    <button class="tab" id="tB" role="tab" data-k="B">Liens en bref</button>
    <button class="tab" id="tF" role="tab" data-k="F">Fun</button>
  </div>
  <form class="add" id="add">
    <div class="addhead">Ajouter mon lien</div>
    <input id="aUrl" type="url" inputmode="url" placeholder="https://… (article, post X, vidéo)" required>
    <input id="aNote" type="text" placeholder="Note pour moi (facultatif)">
    <div class="seg" role="radiogroup" aria-label="Type">
      <label><input type="radio" name="aKind" value="B" checked> Lien en bref</label>
      <label><input type="radio" name="aKind" value="R"> Rubrique</label>
    </div>
    <button class="addbtn" type="submit">Ajouter</button>
  </form>
  <div class="list" id="list"></div>
  </div>
  <div id="viewNum" hidden>
    <div class="sec">Liens en bref</div>
    <div class="cards" id="brefs"></div>
    <div class="sec">Question du jour</div>
    <p class="note">Touchez celle que vous gardez.</p>
    <div class="cards" id="qdj"></div>
    <div class="sec">Rubriques : notes pour écrire</div>
    <div id="docs"></div>
  </div>
</div>
<div class="bar" id="bar">
  <div class="sel" id="sel">Touchez les sujets à garder</div>
  <button class="copy" id="copy">Copier</button>
</div>

<script>
const DATA = __DATA__;
const KEY = "oc-sel-" + document.querySelector(".sub").textContent.slice(0, 24);
let sel = new Set(), tab = "R", mine = [];
try { sel = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); mine = JSON.parse(localStorage.getItem(KEY + "-mine") || "[]"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...sel])); localStorage.setItem(KEY + "-mine", JSON.stringify(mine)); } catch (e) {} };
const order = id => ({ R: 0, B: 1000, F: 2000 }[id[0]]) + +id.slice(1);
const LABEL = { R: "Rubriques", B: "Liens en bref", F: "Fun" };
let asBref = new Set();
try { asBref = new Set(JSON.parse(localStorage.getItem(KEY + "-bref") || "[]")); } catch (e) {}
const saveBref = () => { try { localStorage.setItem(KEY + "-bref", JSON.stringify([...asBref])); } catch (e) {} };
const all = () => [...mine, ...DATA];
const NLRE = /(beehiiv|substack\.com|techtrash\.fr|morningbrew\.com|archive\.techpresso|the-nbs\.fr|thevccorner|newcomer\.co|notboring|a16z\.news|creatorspotlight|media\.hexa)/;
function pretty(u) { try { const x = new URL(u); const p = (x.pathname + x.search).replace(/\/$/, ""); return x.hostname.replace(/^www\./, "") + (p.length > 48 ? p.slice(0, 47) + "…" : p); } catch (e) { return u; } }
function linkLine(u) {
  if (!u) return '<div class="lnk none">🔗 lien d\'origine introuvable</div>';
  let home = false; try { home = new URL(u).pathname.replace(/\/$/, "") === ""; } catch (e) {}
  const warn = NLRE.test(u) || home;
  return `<div class="lnk${warn ? " none" : ""}">🔗 <a href="${esc(u)}" target="_blank" rel="noopener">${esc(pretty(u))}</a>${warn ? " · page newsletter, pas l'article" : ""}</div>`;
}
function age(dm) {
  const [dd, mm] = dm.split("/").map(Number), now = new Date();
  let dt = new Date(now.getFullYear(), mm - 1, dd);
  if (dt > now) dt.setFullYear(dt.getFullYear() - 1);
  const n = Math.floor((now - dt) / 864e5);
  return n <= 0 ? "aujourd'hui" : n === 1 ? "hier" : `il y a ${n} j`;
}
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  for (const t of document.querySelectorAll(".tab")) {
    const k = t.dataset.k;
    const n = all().filter(d => d.kind === k).length;
    const c = [...sel].filter(id => id[0] === k).length + mine.filter(m => m.kind === k).length;
    t.textContent = LABEL[k] + ` · ${c}/${n}`;
    t.setAttribute("aria-selected", k === tab);
  }
  const mineHtml = mine.filter(d => d.kind === tab).map(d => `
    <div class="item on mine">
      <div class="box">✓</div>
      <div style="min-width:0">
        <div class="meta"><span class="id">Mon lien</span><button class="del" data-del="${d.id}" type="button">Retirer</button></div>
        <div class="t">${esc(d.note || d.url)}</div>
        <div class="b"><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.url)}</a></div>
      </div>
    </div>`).join("");
  document.getElementById("list").innerHTML = mineHtml + DATA.filter(d => d.kind === tab).map(d => `
    <div class="item ${sel.has(d.id) ? "on" : ""}" data-id="${d.id}" role="checkbox" tabindex="0" aria-checked="${sel.has(d.id)}">
      <div class="box">${sel.has(d.id) ? "✓" : ""}</div>
      <div style="min-width:0">
        <div class="meta"><span class="id">${d.id}</span><span class="score ${d.score >= 8 ? "hi" : ""}">${String(d.score).replace(".", ",")}/10</span>${d.date ? `<span class="date">📅 ${d.date} · ${age(d.date)}</span>` : ""}</div>${d.kind === "R" ? `<button class="tobref ${asBref.has(d.id) ? "on" : ""}" data-bref="${d.id}" type="button">${asBref.has(d.id) ? "✓ En Lien en bref" : "Passer en Lien en bref"}</button>` : ""}
        <div class="t">${esc(d.title)}</div>
        <div class="b">${esc(d.body)}</div>${linkLine(d.url)}
      </div>
    </div>`).join("");
  const ids = [...sel].sort((a, b) => order(a) - order(b));
  const n = ids.length + mine.length;
  document.getElementById("sel").innerHTML = n ? `<b>${n}</b> · ${[...ids, ...(mine.length ? [`${mine.length} lien(s) perso`] : [])].join(", ")}` : "Touchez les sujets à garder";
}
function exportText() {
  const ids = [...sel].sort((a, b) => order(a) - order(b)).map(id => asBref.has(id) ? id + " (en bref)" : id).join(", ");
  const lines = mine.map(m => `- [${m.kind === "R" ? "Rubrique" : "Lien en bref"}] ${m.url}${m.note ? " — " + m.note : ""}`);
  return [ids, lines.length ? "Mes liens :\n" + lines.join("\n") : ""].filter(Boolean).join("\n");
}
document.getElementById("add").addEventListener("submit", e => {
  e.preventDefault();
  const url = document.getElementById("aUrl").value.trim();
  if (!url) return;
  const kind = document.querySelector('input[name="aKind"]:checked').value;
  mine.unshift({ id: "M" + Date.now(), kind, url, note: document.getElementById("aNote").value.trim() });
  document.getElementById("aUrl").value = ""; document.getElementById("aNote").value = "";
  tab = kind; save(); render();
});
document.getElementById("list").addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const tb = e.target.closest("[data-bref]");
  if (tb) { const id = tb.dataset.bref; if (asBref.has(id)) asBref.delete(id); else { asBref.add(id); sel.add(id); } saveBref(); save(); render(); return; }
  const del = e.target.closest("[data-del]");
  if (del) { mine = mine.filter(m => m.id !== del.dataset.del); save(); render(); return; }
  const it = e.target.closest(".item[data-id]"); if (!it) return;
  const id = it.dataset.id; sel.has(id) ? sel.delete(id) : sel.add(id); save(); render();
});
document.getElementById("list").addEventListener("keydown", e => {
  if ((e.key === " " || e.key === "Enter") && e.target.classList.contains("item")) { e.preventDefault(); e.target.click(); }
});
for (const t of document.querySelectorAll(".tab")) t.addEventListener("click", () => { tab = t.dataset.k; render(); window.scrollTo(0, 0); });
document.getElementById("copy").addEventListener("click", async () => {
  const text = exportText();
  const btn = document.getElementById("copy");
  if (!text) { btn.textContent = "Rien de coché"; setTimeout(() => btn.textContent = "Copier", 1500); return; }
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copié"; }
  catch (e) { document.getElementById("sel").textContent = text; const r = document.createRange(); r.selectNodeContents(document.getElementById("sel")); getSelection().removeAllRanges(); getSelection().addRange(r); btn.textContent = "Sélectionné"; }
  setTimeout(() => btn.textContent = "Copier", 1500);
});
render();

const NUM = __NUM__;
const md = t => (window.marked ? marked.parse(t.replace(/</g, "&lt;")) : "<pre>" + esc(t) + "</pre>");
function linkify(line) {
  return esc(line).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
async function copyRich(line, btn) {
  const m = line.match(/\[([^\]]+)\]\((https?:[^)]+)\)/);
  const plain = line.replace(/\*\*/g, "").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/, "$1 : $2");
  const html = linkify(line);
  try {
    if (window.ClipboardItem) await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([plain], { type: "text/plain" }) })]);
    else await navigator.clipboard.writeText(plain);
    btn.textContent = "Copié";
  } catch (e) { try { await navigator.clipboard.writeText(plain); btn.textContent = "Copié"; } catch (e2) { btn.textContent = "Copie refusée"; } }
  setTimeout(() => btn.textContent = "Copier", 1500);
}
document.getElementById("brefs").innerHTML = NUM.brefs.map((b, i) => `
  <div class="card">
    <div class="status"><span class="pill ${b.ok ? "" : "warn"}">${b.ok ? "✅ vérifié" : "⚠️ à relire"}</span><span>${esc(b.head)}</span></div>
    ${b.lines.map((l, j) => { const u = (l.match(/\]\((https?:[^)]+)\)/) || [])[1]; return `<div class="bref">${linkify(l)}</div>${u ? linkLine(u) : ""}<button class="small" data-copy="${i}-${j}" type="button">Copier</button>`; }).join("")}
    ${b.note ? `<div class="note">${linkify(b.note)}</div>` : ""}
  </div>`).join("") || '<p class="note">Aucun bref rédigé pour l\'instant.</p>';
document.getElementById("brefs").addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const [i, j] = b.dataset.copy.split("-").map(Number); copyRich(NUM.brefs[i].lines[j], b);
});
let qPick = ""; try { qPick = localStorage.getItem(KEY + "-qdj") || ""; } catch (e) {}
function renderQ() {
  document.getElementById("qdj").innerHTML = NUM.questions.map(q => `
    <div class="card q ${qPick === q.id ? "on" : ""}" data-q="${q.id}" role="radio" tabindex="0" aria-checked="${qPick === q.id}">
      <div class="status"><span class="pill">${esc(q.id)}</span><span>${esc(q.format)}</span><span>${esc(q.note)}/10</span></div>
      <div class="bref"><b>${esc(q.text)}</b></div>
    </div>`).join("");
}
document.getElementById("qdj").addEventListener("click", e => {
  const c = e.target.closest("[data-q]"); if (!c) return;
  qPick = qPick === c.dataset.q ? "" : c.dataset.q; try { localStorage.setItem(KEY + "-qdj", qPick); } catch (er) {} renderQ();
});
renderQ();
document.getElementById("docs").innerHTML = NUM.docs.map((d, i) => `
  <details class="doc"${i === 0 ? " open" : ""}><summary>${esc(d.title)}</summary><div class="md">${md(d.body)}</div></details>`).join("");
for (const a of document.querySelectorAll(".md a")) { a.target = "_blank"; a.rel = "noopener"; }
let view = "tri";
try { view = localStorage.getItem(KEY + "-view") || (NUM.brefs.length ? "num" : "tri"); } catch (e) {}
function setView(v) {
  view = v; try { localStorage.setItem(KEY + "-view", v); } catch (e) {}
  for (const b of document.querySelectorAll(".view")) b.setAttribute("aria-selected", b.dataset.v === v);
  document.getElementById("viewTri").hidden = v !== "tri";
  document.getElementById("viewNum").hidden = v !== "num";
  document.getElementById("bar").hidden = v !== "tri";
}
for (const b of document.querySelectorAll(".view")) b.addEventListener("click", () => setView(b.dataset.v));
setView(view);
</script>
