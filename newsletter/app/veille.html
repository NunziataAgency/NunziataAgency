function exportText() {

  const lines = mine.map(m => `- [${m.kind === "R" ? "Rubrique" : "Lien en bref"}] ${m.url}${m.note ? " — " + m.note : ""}`);
  return [ids, lines.length ? "Mes liens :\n" + lines.join("\n") : ""].filter(Boolean).join("\n");
}
document.getElementById("add").addEventListener("submit", e => {
  e.preventDefault();

  if (!url) return;
  const kind = document.querySelector('input[name="aKind"]:checked').value;
  mine.unshift({ id: "M" + Date.now(), kind, url, note: document.getElementById("aNote").value.trim() });
  document.getElementById("aUrl").value = ""; document.getElementById("aNote").value = "";

});
document.getElementById("list").addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const tb = e.target.closest("[data-bref]");
  if (tb) { const id = tb.dataset.bref; if (asBref.has(id)) asBref.delete(id); else { asBref.add(id); sel.add(id); } saveBref(); save(); render(); return; }
  const del = e.target.closest("[data-del]");
  if (del) { mine = mine.filter(m => m.id !== del.dataset.del); save(); render(); return; }
  const it = e.target.closest(".item[data-id]"); if (!it) return;
  const id = it.dataset.id; sel.has(id) ? sel.delete(id) : sel.add(id); save(); render();
});
document.getElementById("list").addEventListener("keydown", e => {
  if ((e.key === " " || e.key === "Enter") && e.target.classList.contains("item")) { e.preventDefault(); e.target.click(); }
});
for (const t of document.querySelectorAll(".tab")) t.addEventListener("click", () => { tab = t.dataset.k; render(); window.scrollTo(0, 0); });
document.getElementById("copy").addEventListener("click", async () => {
  const text = exportText();
  const btn = document.getElementById("copy");
  if (!text) { btn.textContent = "Rien de coché"; setTimeout(() => btn.textContent = "Copier", 1500); return; }
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copié"; }
  catch (e) { document.getElementById("sel").textContent = text; const r = document.createRange(); r.selectNodeContents(document.getElementById("sel")); getSelection().removeAllRanges(); getSelection().addRange(r); btn.textContent = "Sélectionné"; }
  setTimeout(() => btn.textContent = "Copier", 1500);
});

bs prédisait que la France pouvait dominer l'Europe de la tech** [Lien](https://www.instagram.com/reel/DeHfQIZFO-X/)"], "note": "Vérif : le reel n'a pas pu être ouvert. Il s'agit très probablement de la première interview de Jobs en France (1984, archives INA) : selon Universfreebox, il y parle des « étudiants les plus brillants » et de centaines de « mini entreprises » de logiciels qui pourraient faire dominer l'Europe à la France. Vérifie que le reel parle bien de cette interview avant de publier. · Source : https://www.universfreebox.com/article/42982/Quand-Steve-Jobs-des-1984-predisait-le-potentiel-francais-de-creation-de-start-up/amp"}, {"head": "Mon lien — Guide SEO avec l'IA — ⚠️", "ok": false, "lines": ["🔎 **Le guide ultime pour faire du SEO avec l'IA, et se faire citer par ChatGPT** [Lien](https://x.com/nicholasdulait/status/2108212094214529135)"], "note": "Vérif : le post X n'a pas pu être lu (accès payant) : titre écrit d'après ta note seulement. Relis le post avant de publier. Contexte utile : Vercel dit que 50 % de ses nouveaux clients viennent d'agents IA (R3)."}], "questions": [{"id": "A-0001", "text": "Si une IA résout un problème du millénaire, la médaille revient à qui ?", "format": "ouverte", "note": "8"}, {"id": "A-0002", "text": "Votre métier, il se fait à 100 % sur un ordinateur ?", "format": "ouverte", "note": "8,5"}, {"id": "A-0003", "text": "Starlink ou IRIS² : à qui confieriez-vous votre connexion en cas de guerre ?", "format": "sondage (Starlink / IRIS² / aucun)", "note": "7"}, {"id": "A-0004", "text": "Combien faut-il avoir de côté pour arrêter de bosser ?", "format": "ouverte", "note": "9"}, {"id": "A-0005", "text": "Avez-vous déjà levé de l'argent auprès de vos proches ?", "format": "oui / non + histoire", "note": "7,5"}, {"id": "A-0006", "text": "Mistral ou IA chinoise : vous mettez quoi dans votre produit ?", "format": "sondage (Mistral / chinoise / américaine)", "note": "8"}, {"id": "A-0007", "text": "Laisseriez-vous un agent IA acheter à votre place ?", "format": "oui / non + limite", "note": "7,5"}, {"id": "A-0008", "text": "Budget 2027 : allez-vous changer de statut ou de montage ?", "format": "ouverte", "note": "8"}, {"id": "A-0009", "text": "Claude ou ChatGPT : avez-vous changé d'outil cette année ?", "format": "sondage", "note": "7,5"}, {"id": "A-0010", "text": "Quel est l'abonnement le plus dur que vous ayez dû résilier ?", "format": "ouverte (fun)", "note": "6,5"}], "docs": [{"title": "« Seul un tiers de l'économie est faisable sur ordinateur » (Moll & Imas, Potts)", "body": "# « Seul un tiers de l'économie est faisable sur ordinateur » (Moll & Imas, Potts) — note du 11/10/2026\n\nLimites de la recherche (budget 8 recherches / 3 lectures) : aucun post X pertinent retrouvé ; le papier SSRN de Potts est inaccessible (403), seules les citations relayées par Kling sont disponibles ; le chiffre « -700 000 emplois cols blancs (Levanon) » n'a PAS pu être confirmé ; Shift et Scale (robots/vidéo) non vérifiés.\n\n## L'essentiel en 5 lignes\n- Ben Moll et Alex Imas (essai du 09/09/2026) jugent une croissance à deux chiffres « extrêmement improbable » sur 10-15 ans ; leur base raisonnable : 4-5 %/an (déjà énorme). Ils citent Epoch AI : environ un tiers du travail est faisable sur ordinateur.\n- Mécanismes de frein : automatisation lente du travail physique, coût de Baumol (la demande migre vers ce qui reste humain), « la tâche n'est pas le métier ».\n- Jason Potts (SSRN, relayé par Kling le 11/10/2026) : les universités vendent du « matching » et de la « vérification », pas du contenu ; l'IA est la première techno à toucher les deux fonctions.\n- Signaux contraires côté emploi : cols blancs US en recul depuis 2022-23 (Levanon/Burning Glass), jeunes diplômés français moins embauchés en CDI dans les métiers exposés (LIFT-HEC / Banque de France, ~75 000/an).\n- Le physique est la prochaine frontière : Mecka AI lève 60 M$ pour filmer des humains au travail et entraîner des robots (le « refuge manuel » est précisément ce qu'on cherche à capter).\n\n## Chronologie / contexte daté\n- 📅 Ancien (contexte) : Dingel & Neiman — 37 % des emplois US faisables entièrement à distance (via Epoch, cité sans date précise ici).\n- 📅 Ancien (contexte) : Epoch AI, « Consequences of automating remote work » — ~34 % des tâches faisables à distance (classification GPT-4o sur O*NET) ; date non vérifiée.\n- 📅 12/02/2026 : Axios — emploi « core white-collar » en baisse de 1,9 % depuis nov. 2022 (Levanon).\n- 📅 09/06/2026 : Axios — finance/information/services aux entreprises : -2 % depuis avril 2023, ~19 000 emplois perdus par mois en moyenne.\n- 📅 Jusqu'à 03/2026 : fin de la période de données de l'étude Banque de France / LIFT (HEC Paris). Date de publication non vérifiée.\n- 📅 09/09/2026 : essai Moll & Imas « Will AI soon lead to double-digit growth? ».\n- 📅 ~07/10/2026 : Mecka AI annonce 60 M$ (une source date l'annonce du 07/10 ; la structure du tour diffère selon les médias).\n- 📅 11/10/2026 : Kling relaie Moll/Imas et Potts.\n\n## Chiffres clés (chacun avec source)\n- ~1/3 du travail faisable sur ordinateur (Epoch AI, cité par Moll & Imas, 09/09/2026) — https://aleximas.substack.com/p/will-ai-soon-lead-to-double-digit\n- Croissance baseline 4-5 %/an sur 10-15 ans ; >10 % « extrêmement improbable » (Moll & Imas, 09/09/2026, même lien).\n- Doubler le PIB en 15 ans = ~4,7 %/an ; 16,6 % = ×10 en 15 ans (même source).\n- Scénarios haussiers cités : Amodei 10-15 %/an ; Aschenbrenner 30 %+ (même source).\n- Chad Jones (élasticité 0,2) : un tiers du PIB automatisé = +11 % de PIB ; la moitié = +19 % (même source).\n- Revenu des ordinateurs : ~4,3 % (2000) → ~3 % aujourd'hui ; ~20 % du PIB non mesuré aux prix de marché ; valeur des chatbots ~170 Md$/an pour les consommateurs US (Brynjolfsson et al.) (même source).\n- Délais d'adoption historiques ~45 ans, 7-18 ans pour les techs récentes (Comin & Mestieri, via même source).\n- Dingel & Neiman : 37 % des emplois US 100 % télétravaillables ; Epoch : ~34 % des tâches (unités différentes) — https://epoch.ai/gradient-updates/consequences-of-automating-remote-work (via recherche, non lu en entier).\n- Cols blancs US : 34 M d'emplois, ~22 % du total ; ~-19 000/mois depuis avril 2023 — https://axios.com/2026/06/09/white-collar-jobs-labor-market (09/06/2026). Autre mesure : -191 000/an en moyenne sur 3 ans vs +569 000/an en 2010-2019 — https://www.axios.com/2026/02/12/ai-jobs-market-unemployment-rate (12/02/2026). Ces chiffres ne donnent pas -700 000 ; l'origine du chiffre reste à retrouver.\n- France : embauches CDI des 21-29 ans -28,3 % dans les métiers les plus exposés vs -7,5 % dans les moins exposés ; ~75 000 CDI/an (estimation, pas un décompte de suppressions) ; jeunes développeurs -42 % depuis fin 2022 ; entreprises fortes utilisatrices d'IA : 17-25 % de jeunes en CDI en moins (enquête BdF, ~6 000 entreprises, 2025). Clubic donne -28,9 %. — https://www.banque-france.fr/fr/publications-et-statistiques/publications/ia-generative-les-premiers-changements-du-marche-du-travail-sur-les-jeunes ; https://www.clubic.com/actualite-633421-alerte-sur-l-emploi-des-jeunes-l-ia-a-detruit-75-000-cdi-par-an-en-france.html\n- Mecka AI : 60 M$ (Sequoia, Nvidia, Qualcomm, M12 selon BetaKit/Dealroom ; autres sources : SAFE 25 M$ + 35 M$) ; revenu récurrent annoncé ~100 M$ ; valorisation non divulguée — https://betakit.com/mecka-ai-reveals-60-million-usd-series-b-round-backed-by-sequoia-nvidia/\n\n## Acteurs et positions\n- Ben Moll (LSE/économiste) & Alex Imas (Chicago Booth) : sceptiques sur la croissance explosive ; les modèles de croissance « n'imposent pas » un plafond, mais les 5 hypothèses (automatisation rapide de toute l'économie, demande, investissement, pas de cyber-chocs, R&D automatisée) sont fragiles. (Affiliations non vérifiées dans mes sources.)\n- Arnold Kling : relais ; pense que la part faisable sur ordinateur est probablement inférieure à un tiers car beaucoup de travail est social (persuader, comprendre).\n- Jason Potts : IA = première techno à menacer le modèle universitaire (matching + vérification).\n- Epoch AI : thèse inverse — automatiser le travail à distance suffirait à doubler l'économie (scénario prudent) voire ×10+ (optimiste).\n- Gad Levanon (Burning Glass Institute) : cols blancs plus exposés que manuel/services ; surdimensionnement possible d'effectifs.\n- Chercheurs LIFT-HEC / Banque de France (Palladino, Bergeaud, Bertheau, Bunel, Degos) : effet via moindre embauche des jeunes, pas via licenciements.\n- Mecka AI (CEO Josh Gao) : monétiser le geste humain filmé en première personne pour robots humanoïdes.\n\n## Ce que dit X\n- Aucun post X retrouvé via recherche (site:x.com) — à compléter à la main. Seule trace : Moll & Imas citent un tweet de Sholto Douglas (endosé par Elon Musk) impliquant 100 % de croissance/an (lien non fourni).\n- Réactions en commentaires de l'essai (Substack) : Philip Trammell juge le cas « zéro réallocation » trop pessimiste ; « Tom C » conteste l'élasticité 0,2.\n\n## Débat et incertitudes\n- Contre le « tiers » : Kling (probablement moins) vs Epoch (34 % des tâches) vs Dingel-Neiman (37 % des emplois) : unités différentes, ne pas les mélanger.\n- Contre Moll & Imas : Trammell (réallocation des travailleurs) ; Epoch (le non-remote ne serait pas un goulot majeur).\n- Les robots peuvent réduire le « refuge » physique : la donnée vidéo humaine (Mecka) est le chaînon manquant, mais le délai est inconnu.\n- Cols blancs : la baisse mêle sur-embauche post-Covid, rationalisation et IA ; un fact-check trouvé juge « non étayée » la prédiction de pertes nettes 2026-2036 (Goldman, WEF, KPMG voient des gains nets). Le -700 000 reste non vérifié.\n- Étude française : corrélation sur métiers exposés, pas toute l'explication ; les données s'arrêtent à 03/2026.\n\n## 3 angles possibles\n1. « Le refuge manuel a une date de péremption » — thèse : le travail physique protège aujourd'hui, mais on paie déjà des gens pour filmer leurs gestes. Original : retourne l'idée reçue « plombier = safe ». Faits : Mecka 60 M$, EgoVerse, baseline 4-5 % de Moll & Imas (le physique freine, il ne bloque pas).\n2. « Le goulot, c'est le physique, donc l'opportunité » — thèse : si l'IA est cognitive et que l'économie reste physique, la valeur se déplace vers ce que l'IA ne remplace pas (métiers, logistique, vérification, confiance). Original : lecture business pour freelances. Faits : Baumol, 1/3 faisable sur ordinateur, « la tâche n'est pas le métier ».\n3. « Matching et vérification » — thèse : Potts s'applique aux freelances : vendre de la certification et de la mise en relation plutôt que du contenu. Original : transposition de l'université au marché du freelance. Faits : citations Potts, baisse des CDI jeunes en France.\n\nAngle le plus fort : le n°2, mais nuancé par le n°1 — le physique freine la croissance de l'IA (4-5 %, pas 10 %+), donc l'opportunité est réelle, mais on est déjà en train de numériser ce savoir-faire.\n\n## Munitions\nChiffres : (1) ~1/3 du travail sur ordinateur ; (2) 4-5 % vs >10 % de croissance ; (3) -28,3 % vs -7,5 % d'embauches CDI jeunes ; (4) -42 % développeurs juniors en CDI depuis fin 2022 ; (5) 60 M$ pour Mecka, ~100 M$ de revenu récurrent annoncé.\nCitations exactes :\n- « But only around a third of the economy consists of work that can be done on a computer » (Moll & Imas, via Kling).\n- « growth may be constrained not by what we do well but rather by what is essential and yet hard to improve. » (Aghion, Jones & Jones, cité par Moll & Imas).\n- « the task is not the job. » (Garicano, cité par Moll & Imas).\n- « AI is the first technology to reach both functions » ; « They sell matching and verification » (Potts, via Kling).\nDétails surprenants : les auteurs ont un pari public (croissance du PIB/hab US sous 15 % chaque année jusqu'en 2033) : http://benjaminmoll.com/growth_bet/ ; les 20 % du PIB non mesurés au prix de marché ; les participants Mecka portent lunettes connectées ou smartphone sur serre-tête, pour cuisine, labos de chimie, métallurgie, maroquinerie.\n\n## Stock d'articles\n- ⭐ Will AI soon lead to double-digit growth? — Substack Alex Imas / Ben Moll — 📅 09/09/2026 — https://aleximas.substack.com/p/will-ai-soon-lead-to-double-digit — source primaire, tous les chiffres.\n- ⭐ Economy and AI links — Arnold Kling (Substack) — 📅 11/10/2026 — https://arnoldkling.substack.com/p/economy-and-ai-links-1082026 — relais de Moll/Imas et Potts, citations.\n- ⭐ IA générative : les premiers changements du marché du travail sur les jeunes — Banque de France — 📅 date non vérifiée — https://www.banque-france.fr/fr/publications-et-statistiques/publications/ia-generative-les-premiers-changements-du-marche-du-travail-sur-les-jeunes — étude originale.\n- Potts, papier universités — SSRN — 📅 non vérifiée — https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7453440 — non lu (403).\n- Consequences of automating remote work — Epoch AI — 📅 non vérifiée (contexte) — https://epoch.ai/gradient-updates/consequences-of-automating-remote-work — 34 % des tâches, thèse contraire.\n- Alerte sur l'emploi des jeunes : l'IA a détruit 75 000 CDI par an — Clubic — 📅 non vérifiée — https://www.clubic.com/actualite-633421-alerte-sur-l-emploi-des-jeunes-l-ia-a-detruit-75-000-cdi-par-an-en-france.html — relais grand public (attention au mot « détruit »).\n- White-collar jobs are under pressure, but the labor market is fine — Axios — 📅 09/06/2026 — https://axios.com/2026/06/09/white-collar-jobs-labor-market — chiffres Levanon.\n- The office job decline may solve a mystery of the 2020s economy — Axios — 📅 12/02/2026 — https://www.axios.com/2026/02/12/ai-jobs-market-unemployment-rate — idem.\n- Mecka AI reveals $60-million USD Series B — BetaKit — 📅 ~10/2026 — https://betakit.com/mecka-ai-reveals-60-million-usd-series-b-round-backed-by-sequoia-nvidia/ — financement.\n- Mecka AI trains robots by watching humans work — Techstrong.ai — 📅 non vérifiée — https://techstrong.ai/articles/mecka-ai-trains-robots-by-watching-humans-work/ — méthode.\n- The Bridge (JP) — 📅 09/2026 — https://thebridge.jp/2026/09/ai-double-digit-gdp-growth-five-assumptions — reprise de l'essai.\n"}, {"title": "Marketing Mania, « Au revoir » de Stanislas Leloup", "body": "# Marketing Mania, « Au revoir » de Stanislas Leloup — note du 11/10/2026\n\n> Statut des sources : le contenu de la vidéo n'a PAS pu être lu (YouTube ne renvoie que le bandeau de navigation ; service de transcription = HTTP 403). Seul le titre et la chaîne sont vérifiés (oEmbed YouTube). Tout ce qui concerne le contenu de la vidéo vient des notes d'Arthur et est marqué « non vérifié ». Aucun article de presse, post X ni fil Reddit trouvé sur cette annonce.\n\n## Ce que dit la vidéo\n- URL : https://youtu.be/XtZhmTOPDow\n- Titre : « Au revoir » — vérifié (oEmbed YouTube, consulté le 11/10/2026).\n- Chaîne : Marketing Mania — vérifié (même source).\n- Date de publication, durée, description, chapitres, vues, commentaires : NON VÉRIFIÉ (page inaccessible).\n- Points clés selon les notes d'Arthur (NON VÉRIFIÉS, à contrôler en regardant la vidéo) :\n  - c'est l'annonce que « Marketing Mania, c'est fini » ;\n  - il dit que sa vie est « tellement cool » ;\n  - il a beaucoup épargné ;\n  - analyse d'un business qui travaille pour soi ;\n  - retraite anticipée (FIRE).\n- Citations exactes avec minutage : aucune disponible. À prendre en regardant la vidéo.\n- Le titre « Au revoir » est cohérent avec l'idée d'une annonce de fin, mais ne la prouve pas (une recherche web n'a trouvé aucune confirmation indépendante).\n\n## L'essentiel en 5 lignes\n- Le titre vérifié de la vidéo sur la chaîne Marketing Mania est « Au revoir » ; le reste (arrêt, épargne, FIRE) vient des notes d'Arthur, non confirmé.\n- Stan Leloup a lancé la chaîne en 2017 depuis le Vietnam ; elle approche les 500 000 abonnés (lesmakers.fr, article du 27/09/2024, maj 23/01/2025).\n- « Arc how chin min » = très probablement Hô-Chi-Minh-Ville : il s'y est installé en 2015 (lesmakers.fr). Hypothèse d'interprétation, non confirmée par la vidéo.\n- Son modèle : contenu YouTube gratuit long format, liste email de « plusieurs dizaines de milliers » de prospects, formations payantes.\n- Aucune presse, aucun post X/Reddit indexé sur l'annonce au 11/10/2026 : l'angle est à construire sur la vidéo elle-même.\n\n## L'arc de Marketing Mania (chronologie)\n- Avant 2012 : études à l'ESSEC, qu'il quitte (date exacte non précisée) — lesmakers.fr, 27/09/2024.\n- 2012 : à 21 ans, « sans un sou en poche », lance Séduction Academy (hommes timides) et se met au blogging — lesmakers.fr.\n- 2015 : s'installe au Vietnam, à Hô-Chi-Minh (communauté de nomades digitaux) ; se forme au copywriting — lesmakers.fr.\n- Date non précisée : podcast Nomade Digital avec son ami Paul — lesmakers.fr.\n- Date non précisée : agence de publicité Facebook « Marketing Mania », abandonnée pour un organisme de formation en ligne — lesmakers.fr.\n- 2017 : lancement de la chaîne YouTube, une vidéo par semaine au départ, puis vidéos de 20 à 60 min — lesmakers.fr.\n- 2019 : coaching en présentiel, échec (« cela n'a pas du tout fonctionné ») — lesmakers.fr.\n- Podcast Marketing Mania : bimensuel, 119 épisodes selon Rephonic (date de relevé inconnue).\n- 11/10/2026 : vidéo « Au revoir » (date de mise en ligne non vérifiée).\n\n## Chiffres clés\n- Abonnés YouTube : « presque 500 000 » — lesmakers.fr (27/09/2024, maj 23/01/2025). Autres relevés plus anciens : « plus de 350 000 » (Rephonic, non daté), « 467k » (learnthings.fr, non daté). Chiffre actuel : non vérifié.\n- Liste email : « plusieurs dizaines de milliers de prospects » — lesmakers.fr (même date).\n- Podcast : 119 épisodes, rythme tous les 15 jours — Rephonic (non daté) / HubSpot FR (non daté).\n- Chiffre d'affaires, prix et nombre d'élèves des formations : NON TROUVÉS, aucun montant public vérifié.\n- FIRE : épargne de 50 à 75 % des revenus contre ~10 % pour un ménage classique ; règle des 25 fois les dépenses annuelles / retrait de 4 % (étude Trinity, 1998) ; âge moyen de départ en France 63 ans — sinvestir.fr, postfinance.ch (dates non relevées).\n\n## Le modèle : épargne, business qui travaille pour soi, retraite anticipée\n- FIRE = indépendance financière + retraite anticipée : épargne massive, portefeuille ≈ 25 × dépenses annuelles, retrait de 4 %/an ajusté de l'inflation.\n- Limites connues de la règle : taux jugé optimiste par certains (2,5 % = 40 × dépenses), inflation, impôts, durée longue — sinvestir.fr.\n- Fiscalité FR : PEA exonéré d'IR après 5 ans, assurance-vie après 8 ans ; prélèvements sociaux dus.\n- Mouvement jugé peu connu en France, en hausse : Euronews, 18/08/2026, « Prendre sa retraite à 40 ans : les jeunes actifs misent sur le mouvement FIRE » (non lu en détail).\n- « Business qui travaille pour soi » : aucune source trouvée traitant ce modèle précis ; à documenter depuis la vidéo (non vérifié que Stan parle de revente, d'automatisation ou de délégation).\n- Pour Stan, le lien avec son parcours (nomade digital, vie au Vietnam depuis 2015) est une inférence, pas un fait vérifié.\n\n## Réactions\n- X (site:x.com) : rien trouvé, 11/10/2026. Les pages X sont mal indexées : à vérifier à la main (compte de Stan, recherche « Marketing Mania »).\n- Reddit : rien trouvé, 11/10/2026.\n- Presse : rien trouvé sur l'annonce, 11/10/2026.\n- Commentaires YouTube : inaccessibles.\n\n## Débat et zones d'ombre\n- Fin réelle ou pause ? « Au revoir » ne dit pas si la chaîne, les formations, l'équipe et la liste email s'arrêtent, ou si la marque est vendue (non vérifié).\n- Que devient l'offre de formation (accès, support, remboursement) ? Non vérifié.\n- Épargne et « business qui tourne sans soi » : chiffres jamais publics ? À chercher dans la vidéo.\n- Critique récurrente : un avis cité dans la recherche dit que Marketing Mania « est là pour vendre ses formations » (email et vidéos, source non datée) — pour nuancer le récit « vie cool ».\n- Biais de survivant côté FIRE : un créateur à ~500 000 abonnés n'est pas représentatif d'un freelance.\n\n## 3 angles possibles\n1. Thèse : « Le business qui tourne sans soi, c'est d'abord une audience » — Pourquoi original : relie la sortie d'un créateur à la mécanique réelle de la retraite anticipée (actifs vs épargne). Faits : 2017 chaîne, ~500 000 abonnés, liste email, formations ; règle des 4 %. Dépend du contenu de la vidéo.\n2. Thèse : « Quitter au sommet : le créateur FIRE » — Pourquoi original : lire « Au revoir » à travers la montée du FIRE en France. Faits : Euronews 18/08/2026 ; épargne 50-75 % ; trajectoire nomade Saigon 2015.\n3. Thèse : « Ce que les freelances peuvent copier (et ne pas copier) » — Pourquoi original : angle pratique pour la cible d'Order & Chaos. Faits : parcours ESSEC > blog 2012 > Vietnam 2015 > YouTube 2017 > échec coaching 2019.\n\nAngle le plus fort : l'angle 1. Un créateur qui s'arrête dit surtout combien son business reposait sur lui ou non ; c'est la vraie question pour un freelance, à trancher avec les chiffres de la vidéo.\n\n## Munitions\n- Titre exact : « Au revoir » (chaîne Marketing Mania).\n- « presque 500 000 abonnés », « plusieurs dizaines de milliers de prospects » (lesmakers.fr).\n- Parcours : 21 ans, « sans un sou en poche », 2012 ; Vietnam 2015 ; YouTube 2017.\n- « cela n'a pas du tout fonctionné » (coaching présentiel 2019, lesmakers.fr).\n- Règle des 25 × dépenses ; retrait de 4 % ; étude Trinity 1998.\n- Épargne FIRE 50-75 % contre ~10 %.\n- À CONFIRMER avant publication : date de la vidéo, durée, citations de Stan, chiffres d'épargne, sens exact de « c'est fini ».\n\n## Stock d'articles et vidéos\n- ⭐ Au revoir — YouTube (Marketing Mania) — 📅 date non vérifiée — https://youtu.be/XtZhmTOPDow — source primaire à regarder.\n- ⭐ Stan Leloup – Des études au statut de marketeur français n°1 sur YouTube — lesmakers.fr — 📅 27/09/2024 (maj 23/01/2025) — https://lesmakers.fr/stan-leloup — parcours daté, abonnés, Vietnam.\n- ⭐ Prendre sa retraite à 40 ans : les jeunes actifs misent sur le mouvement FIRE — Euronews FR — 📅 18/08/2026 — https://fr.euronews.com/business/2026/08/18/prendre-sa-retraite-a-40-ans-les-jeunes-actifs-misent-sur-le-mouvement-fire — contexte FIRE récent (non lu en détail).\n- Mouvement FIRE : retraite et indépendance financière — sinvestir.fr — 📅 non relevée — https://sinvestir.fr/retraite-anticipee-mouvement-fire-40-ans — règle des 4 %, fiscalité.\n- À la retraite à 40 ans ? Voici comment fonctionne le mouvement FIRE — PostFinance — 📅 non relevée — https://www.postfinance.ch/fr/blog/placer-de-largent-mode-demploi/mouvement-fire.html — principes FIRE.\n- La vérité sur Stanislas Leloup de Marketing Mania (partie 1) — podcast Les Entrepreneurs 2.0 (Ausha) — 📅 non relevée — https://podcast.ausha.co/les-entrepreneurs-2-0-le-podcast/64-la-verite-sur-stanislas-leloup-de-marketing-mania-partie-1 — interview, non lue.\n- Passer d'un business en ligne à un empire avec Stan (Marketing Mania) — podcast J'peux pas j'ai business — 📅 non relevée — https://podcast.ausha.co/jpeux-pas-jai-business/passer-d-un-business-en-ligne-a-un-empire-avec-stan-marketing-mania — modèle business, non lu.\n- Marketing Mania, conversations d'entrepreneurs — Rephonic — 📅 non relevée — https://rephonic.com/podcasts/marketing-mania-conversations-dentrepreneurs — stats podcast.\n"}, {"title": "OpenAI publie 722 manuscrits de maths écrits par une IA", "body": "# OpenAI publie 722 manuscrits de maths écrits par une IA — note du 11/10/2026\n\nMéthode : 8 recherches web + 3 lectures de pages (Numerama inaccessible : bloqué par l'outil, non lu). Presque tout vient de sources secondaires ; je n'ai PAS pu ouvrir la page OpenAI ni le GitHub moi-même (URLs relevées via Decrypt). Les posts X ne sont connus que via des articles qui les citent : aucune URL de post X vérifiée. Toute citation ci-dessous est « telle que rapportée » par le média indiqué.\n\n## L'essentiel en 5 lignes\n- Le 06/10/2026 (mardi), OpenAI met sur GitHub 722 manuscrits (372 « familles » de résultats) produits par un modèle interne non nommé et non publié, sur ~4 000 problèmes ouverts soumis.\n- Vedette : un résultat « quasi-Riemann » (zone sans zéro de la fonction zêta pour Re(s) > 7/8), ce n'est PAS l'hypothèse de Riemann ; Alex Kontorovich (Rutgers) : « instant Fields Medal » si un humain l'avait fait.\n- Vérification partielle : seuls 162 manuscrits sur 722 (~22 %) ont leur résultat principal vérifié en Lean ; OpenAI reconnaît que « certains résultats non formalisés pourraient poser problème ». Le 07/10, 3 manuscrits retirés (erreur de signe).\n- Contexte tendu : 25 médaillés Fields (dont Tao) ont signé le 11/09 une déclaration contre les preuves IA publiées trop vite et en masse ; un groupe « Association for Human Mathematics » appelle à cesser de travailler avec OpenAI.\n- Inquiétude des chercheurs : jeunes chercheurs dont les programmes sont balayés (Buckmaster), culture collaborative fragilisée (Kra), pas de prompts ni de modèle publiés donc pas de reproductibilité (Sutherland).\n\n## Chronologie datée\n- 11/09/2026 : déclaration de 25 médaillés Fields (Tao, Deligne, Scholze, Hairer, Viazovska, Villani, Bhargava…) : les buts des labos d'IA et de la communauté sont « severely misaligned » (officechai ; signataires cités par pasqualepillitteri). Un teaser Briefia parle de « 28 lauréats » : écart de chiffre non résolu.\n- Septembre 2026 (date exacte non vérifiée) : OpenAI revendique Navier-Stokes (10 000 agents coordonnés pendant 88 h, coût estimé jusqu'à 40 M$ selon titre Briefia) ; Levent Alpöge (Anthropic) aurait contesté le crédit (pasqualepillitteri).\n- 21/09/2026 : OpenAI annonce un groupe consultatif indépendant (Advisory Group on Mathematics and AI, IAS, 9 membres bénévoles dont Gowers, Hairer, Witten) — sans pouvoir de décision (thenextweb/aiweekly).\n- 29/09/2026 : le groupe recommande publier vite, divulguer modèle, prompts, raisonnement, calcul, éviter l'usage marketing (Decrypt ; letsdatascience, source unique pour certains détails).\n- 06/10/2026 : publication des 722 manuscrits sur GitHub + annonce sur X (axeetech) ; l'un des manuscrits clés est daté du 05/10.\n- 07/10/2026 : Decrypt et Briefia publient ; OpenAI retire 3 manuscrits (erreur de signe sur « Algebraicity of Weil classes on split abelian eightfolds » + 2 dépendants), révise 14 autres ; catalogue ramené à 719 (aiweekly / Retraction Watch).\n- 08/10/2026 : dépêche Option Finance/Zonebourse « un modèle mystérieux d'OpenAI réalise des avancées en mathématiques ».\n- 09/10/2026 : Winbuzzer.\n- 10/10/2026 : Briefia sur les réactions des chercheurs (Kontorovich, Buckmaster, Kra).\n\n## Chiffres clés (chacun avec source)\n- 722 manuscrits / 372 familles — Decrypt 07/10, Briefia 07/10.\n- ~4 000 problèmes soumis au modèle, seuls les résultats jugés « assez significatifs » publiés — Decrypt 07/10.\n- ~3 h de « ChatGPT Pro thinking » par résultat en moyenne — Briefia 07/10, Decrypt 07/10.\n- 162/722 (~22 %) avec résultat principal en Lean — Decrypt 07/10 ; une autre source donne ~42 % des « top-line results » après révision (aiweekly) : unités différentes, à ne pas mélanger.\n- 10 résumés de raisonnement publiés — Briefia, Decrypt.\n- Zone sans zéro : Re(s) > 7/8 (zêta et fonctions L de Dirichlet) ; un 2e manuscrit (05/10) viserait ~11/12 — officechai (sources divergentes, mindstudio dit 0,875).\n- Bibliothèque Lean : 121 734 fichiers, 25,9 M de lignes — Towards AI (secondaire, à recouper).\n- 3 manuscrits retirés J+1, 14 révisés, 13 références mises à jour, 719 restants — aiweekly/Retraction Watch 07/10.\n- Aucun des 5 problèmes du millénaire ouverts résolu dans ce lot — Nature, rapporté par pasqualepillitteri.\n- Navier-Stokes : 10 000 agents, 88 h — Decrypt.\n- 25 médaillés Fields, déclaration du 11/09 — officechai.\n\n## Acteurs et positions\n- OpenAI : transparence partielle ; manuscrits + Lean + 10 résumés, mais ni nom du modèle, ni prompts, ni calcul par problème. Dépôt avec Issues désactivées, pas de pull requests (Keith Adler, cité par Decrypt). Promet de financer des ateliers pour aider les chercheurs (Briefia 10/10). Porte-parole : presque tout vient d'un seul prompt à un seul agent (Decrypt).\n- Alex Kontorovich (Rutgers) : enthousiaste sur Riemann ; selon Briefia 10/10, la formation mathématique « pourrait prendre de l'importance ».\n- Tristan Buckmaster (NYU, d'après Briefia) : la publication a mis fin à des programmes de jeunes chercheurs ; craint que des projets non publiés alimentent un LLM.\n- Bryna Kra (Northwestern) : risque pour la culture collaborative ; personne ne pourrait présenter ces résultats en conférence.\n- Andrew Sutherland (MIT) : tout « one-shot » est non vérifié tant que le modèle n'est pas publié.\n- Daniel Litt (Toronto) : aucune raison de garder prompts/réponses secrets.\n- Abhishek Saha : « very big day for mathematics ». Dmitry Rybin : « totally unbelievable alien math ».\n- Levent Alpöge (Anthropic) : « moment le plus significatif de l'histoire des mathématiques » (pasqualepillitteri) — notable car concurrent.\n- Terence Tao / médaillés Fields : critique de la vitesse et de la perte de compréhension (citation « too crazy » d'une source de mauvaise qualité, à ne pas utiliser).\n- Francesco Maggi (UT Austin) : qui peut digérer des centaines d'articles ? Association for Human Mathematics : appel à arrêter de travailler avec OpenAI.\n- Groupe IAS : « human understanding of mathematics remains of paramount importance » ; participation ≠ caution des résultats.\n- Anthropic (comparaison Decrypt) : preuve Lean de Fermat publiée (13 M de lignes), mais formalisation de Wiles 1995, pas du nouveau.\n\n## Ce que dit X (citations avec lien)\nAucun post X ouvert directement ; liens = articles qui les citent.\n- Alex Kontorovich : « If a human did this, it would be an instant Fields Medal, no questions asked. » — via https://officechai.com/ai/mathematicians-react-with-shock-and-wonder-after-openai-releases-over-300-math-proofs-at-once/ (et humanprogress.org)\n- Dmitry Rybin : « totally unbelievable alien math » — via https://decrypt.co/380366/openai-secret-ai-model-cracked-hundreds-math-problems-one-prompt\n- Sam Altman (« looking up at stars with extra awe tonight ») — via https://officechai.com/ai/looking-up-at-stars-with-extra-awe-tonight-sam-altman-after-openai-publishes-300-math-proofs-including-quasi-riemann-hypothesis/ (titre ; libellé exact non vérifié)\n- Annonce OpenAI sur X le 06/10 — via axeetech.com (secondaire).\n\n## Débat et incertitudes\n- « Digne d'une médaille Fields » : conditionnel (« si un humain »), et pour un résultat qui n'est pas Riemann. Le titre Numerama (non lu) cadre sur Riemann.\n- Lean : prouve la cohérence logique, pas que l'énoncé formalisé correspond au problème, ni sa nouveauté (Decrypt). 78 % du lot sans vérification formelle.\n- Erreurs déjà : 3 retraits en 24 h.\n- Pas de reproductibilité : modèle, prompts non publiés ; non-respect partiel des recommandations du groupe consultatif (2 respectées, 2 en partie, 2 non, selon letsdatascience).\n- Comptes confus : « 300 résultats » / « 722 » / « 700+ » = unités différentes (familles vs manuscrits) ; « plus de 100 problèmes » pour la revendication de septembre.\n- Qui valide ? Les relecteurs humains sont le goulot ; effet sur carrières des jeunes et crédit des idées.\n- Écart : 25 vs 28 médaillés Fields ; contenu exact de la déclaration lu seulement en secondaire.\n- Conflit d'intérêts/communication : OpenAI juge et partie ; rivalité Anthropic/OpenAI sur le crédit.\n\n## 3 angles possibles\n1. « Après le code, la recherche : la vérification devient le vrai métier » — thèse : quand produire coûte 3 h de calcul, la valeur se déplace vers ceux qui certifient (relecteurs, Lean, audit). Original : on parle de remplacement, pas du goulot de vérification, transposable aux freelances (audit, conseil). Faits : 162/722 en Lean, 3 retraits en 24 h, Maggi « qui peut digérer ? », 25 Fields.\n2. « Le secret de fabrication : OpenAI publie les résultats, pas la recette » — thèse : la transparence sélective est une stratégie produit/marketing. Original : lit la sortie comme du marketing de capacité, pas de la science. Faits : pas de modèle ni prompts, Issues désactivées, 2/6 recommandations IAS respectées, 4 000 problèmes → 722 triés.\n3. « Les juniors d'abord » — thèse : la première victime est le jeune chercheur, comme le junior dev. Original : lien direct avec les métiers intellectuels (entrée de carrière). Faits : Buckmaster (programmes arrêtés), Kra, « calcul de 3 h par résultat ».\n\nAngle le plus fort : n°1. Quand le coût de production s'effondre (3 h/résultat, 4 000 essais), la rareté passe à la vérification et au jugement ; les métiers qui tombent ensuite sont ceux dont le livrable est invérifiable à bas coût. Il s'appuie sur des faits chiffrés (22 % en Lean, 3 retraits) et parle directement aux freelances.\n\n## Munitions\nChiffres frappants :\n1. 722 manuscrits en une nuit, ~4 000 problèmes tentés.\n2. ~3 h de ChatGPT Pro par résultat.\n3. 162/722 seulement vérifiés en Lean (~22 %).\n4. 3 retraits à J+1 pour une erreur de signe (+1 au lieu de −1).\n5. 25 médaillés Fields signent contre le rythme, 25 jours avant.\nCitations (telles que rapportées) :\n- « If a human did this, it would be an instant Fields Medal, no questions asked. » — Kontorovich (X, via officechai)\n- « We should ask for receipts. » — Andrew Sutherland (via Decrypt 07/10)\n- « some of the unformalized results could have issues » — OpenAI (via Decrypt)\n- « human understanding of mathematics remains of paramount importance » — IAS (via Decrypt)\n- « totally unbelievable alien math » — Dmitry Rybin (X, via Decrypt)\nDétails surprenants :\n- Le « mathématicien d'Anthropic » (concurrent) salue le « moment le plus significatif de l'histoire des maths ».\n- Le dépôt GitHub d'OpenAI a les Issues désactivées et refuse les pull requests.\n- Une erreur +1/−1 a fait tomber un résultat sur la conjecture de Hodge rationnelle.\n- Personne ne pourrait présenter ces résultats en conférence (Kra).\n\n## Stock d'articles\n(Dates : celles lues dans la page ou dans l'URL ; « n.v. » = non vérifiée.)\n- ⭐ Decrypt — « OpenAI Says a Secret AI Model Cracked Hundreds of Open Math Problems in One Prompt—Mathematicians Want Receipts » — Decrypt — 📅 07/10 — https://decrypt.co/380366/openai-secret-ai-model-cracked-hundreds-math-problems-one-prompt — chiffres, citations Sutherland/Saha/Rybin, liens OpenAI (github.com/openai/math ; openai.com/index/sharing-ai-progress-in-mathematics/ non ouverts par moi).\n- ⭐ Briefia (réactions) — « OpenAI diffuse 700 résultats mathématiques et alerte les chercheurs » — Briefia — 📅 10/10 — https://briefia.fr/article/openai-diffuse-700-resultats-mathematiques-et-alerte-les-chercheurs — Buckmaster, Kra, Kontorovich, ateliers OpenAI.\n- ⭐ Retraction Watch / aiweekly — « OpenAI withdraws three preprints a day after releasing 722 manuscripts » — 📅 07/10 — https://retractionwatch.com/?p=136176 — retraits, erreur de signe (titre vu en recherche, non ouvert).\n- Briefia — « OpenAI publie 722 manuscrits mathématiques et détaille sa méthode » — 📅 07/10 — https://briefia.fr/article/openai-publie-722-manuscrits-mathematiques-et-detaille-sa-methode — 3 h de calcul, 372 ensembles, critères d'évaluation.\n- Numerama — « Si un humain avait fait ça, ce serait la médaille Fields » — 📅 n.v. — https://www.numerama.com/tech/2348207-si-un-humain-avait-fait-ca-ce-serait-la-medaille-fields-lia-dopenai-fait-une-percee-sur-lhypothese-de-riemann.html — NON LU (accès bloqué).\n- Officechai — preuves quasi-Riemann/UGC/Hodge — 📅 n.v. (06-07/10) — https://officechai.com/ai/openai-releases-ai-generated-proofs-of-quasi-riemann-hypothesis-unique-games-conjecture-hodge-conjecture-for-cm-abelian-varieties/ — contenu technique, Altman, Lean.\n- Officechai — réactions « shock and wonder » — 📅 n.v. — https://officechai.com/ai/mathematicians-react-with-shock-and-wonder-after-openai-releases-over-300-math-proofs-at-once/ — citations X.\n- Officechai — déclaration des 25 Fields — 📅 11/09 (signature) — https://officechai.com/ai/25-fields-medal-winners-including-terence-tao-sign-declaration-saying-rapid-ai-proofs-are-harming-math-in-severe-misalignment/\n- Winbuzzer — 📅 09/10 — https://winbuzzer.com/2026/10/09/openai-shares-hundreds-of-math-results-from-an-unreleased-ai-xcxwbn/\n- Option Finance — 📅 08/10 — https://www.optionfinance.fr/info-financiere-en-continu/d/2026-10-08-un-modele-mysterieux-dopenai-realise-des-avancees-en-mathematiques.html — presse FR dépêche.\n- Letsdatascience — « OpenAI posted 722 AI-written math papers, kept the prompts » — 📅 n.v. — https://letsdatascience.com/blog/openai-posted-722-ai-written-math-papers-kept-the-prompts — grille IAS (2/6).\n- Pasquale Pillitteri (FR) — 📅 n.v. — https://pasqualepillitteri.it/fr/news/21360/openai-problemes-millenaire-riemann-hodge — Nature, Alpöge (source de faible fiabilité).\n- Towards AI — 📅 n.v. — https://pub.towardsai.net/openais-ai-wrote-722-maths-papers-checking-them-was-the-easy-part-886e1a827c28 — angle vérification (payant).\n- The Next Web — groupe consultatif — 📅 ~21/09 n.v. — https://thenextweb.com/news/openai-maths-advisory-group-100-open-problems\n- YourStory — 📅 n.v. — https://yourstory.com/ai-story/openai-ai-open-maths-problems-solved\n"}, {"title": "Starlink, l'arme qui rend Musk intouchable", "body": "# Starlink, l'arme qui rend Musk intouchable — note du 11/10/2026\n\n> Limites de la recherche : la page Business Insider (11/10) n'a pas pu être lue (WebFetch bloqué) ; je n'ai donc que son angle tel que décrit dans le brief. Aucun post X n'a pu être lu directement (la recherche `site:x.com` ne renvoie que de la presse qui les cite). Les chiffres d'abonnés / CA / valorisation viennent de sources secondaires (SpaceX ne publie pas de comptes audités, sauf IPO : à vérifier avant publication).\n\n## L'essentiel en 5 lignes\n- Le 06/10, la FCC a autorisé 15 000 satellites « Starlink Mobile » (direct-to-device) en très basse orbite, avec dérogation pour vendre sans bail de spectre avec un opérateur terrestre (SpaceX peut devenir son propre opérateur).\n- Le 09/10, AST SpaceMobile a chuté de ~13,6 % ; la baisse des opérateurs (AT&T, Verizon, T-Mobile ~-7 %) n'est signalée que par une source, non confirmée.\n- Le 09-10/10, Musk accuse des « oligarques » de bloquer Starlink en Inde et ironise sur « Prime Minister Ambani » ; New Delhi nie toute discrimination. Starlink a sa licence depuis 2025 mais n'a toujours pas lancé commercialement.\n- Côté Europe, IRIS² (348 satellites, lancements à partir de 2029) et OneWeb (+229 satellites d'ici 2034) sont vus comme la réponse souveraine, face à une constellation Starlink de plus de 10 000 satellites actifs.\n- Le 08/10, Fortastra lève 30 M$ pour des satellites « gardes du corps » : la protection des constellations devient un marché.\n\n## Chronologie datée\n- (contexte) 2022-2023 : épisodes Ukraine ; Musk refuse d'activer Starlink près de la Crimée en 2023 (« major escalation ») — sofrep / the-generation, dates exactes non vérifiées.\n- (contexte) 03/2025 : accord Jio–SpaceX pour distribuer Starlink en Inde (Khaleej Times / Kathmandu Post, 12/03/2025).\n- (contexte) 12/2025 : opposants à l'octroi de dérogations permanentes à EchoStar liées au transfert de spectre vers SpaceX (Broadband Breakfast).\n- (contexte) 01/2026 : FCC ajoute 7 500 satellites Gen2 (total Gen2 15 000) — Malay Mail, 11/01/2026. Ne pas confondre avec les 15 000 d'octobre.\n- (contexte) 02/2026 : SpaceX valorisée 1 250 Md$ (1,25 trillion $) lors d'une vente secondaire (source secondaire).\n- 08/2026 : Commission européenne et SpaceRISE signent l'accord d'exécution IRIS² (TheNextWeb / Kratos, août 2026, jour précis non vérifié).\n- 01/10 : lancement de 2 prototypes Fortastra (Watchdog V0) sur Transporter-18 de SpaceX.\n- 06/10 : la FCC approuve les 15 000 satellites D2D (SatelliteToday, 07/10).\n- 07/10 : Musk (mercredi) : « Unfortunately, we are being blocked by certain oligarchs » (Gulf News, 09-10/10).\n- 08/10 : Fortastra annonce sa Série A de 30 M$ (Satellite Today, 08/10).\n- 09/10 : Musk : « Prime Minister Ambani » ; AST SpaceMobile -13,59 % à 49,195 $ ; gouvernement indien rejette les accusations.\n- 11/10 : Business Insider : Starlink, « joyau » de l'empire Musk (non lu).\n\n## Chiffres clés (chacun avec source)\n- 15 000 satellites D2D autorisés, 9 couches orbitales entre 326 et 335 km ; service prévu fin 2027 ; transfert final des licences EchoStar attendu vers le 30/11/2027 — Satellite Today, 07/10.\n- ~650 satellites D2D existants — Satellite Today, 07/10.\n- >10 000 satellites actifs Starlink — commentaire cité par TheNextWeb (08/2026), imprécis.\n- Abonnés : 8,9 à 9,2 M fin 2025 ; >10 M en 02/2026 ; projection 18,4 M fin 2026 (Payload, via recherche ; sources divergentes). Autre source : 13 M dans 167 pays (the-generation, date inconnue : ancien).\n- CA : Starlink ~10,4 Md$ sur ~15 Md$ de CA SpaceX 2025 (Payload) ; ~11,8 Md$ selon Quilty Space. ARPU en baisse ~18 % entre 2023 et 2025 (analyse sur dossiers, source secondaire).\n- Valorisation SpaceX : 1,25 trillion $ (secondaire 02/2026) ; IPO visée jusqu'à ~1,75 trillion $ (rumeur 04/2026), ticker SPCX — statut IPO NON confirmé, à vérifier. Starlink seul : 500-700 Md$ selon Morgan Stanley, ARK, Sacra (Nasdaq / Motley Fool, 02/2026).\n- IRIS² : 348 satellites, dont 66 défense/sécurité, lancements dès 2029 ; OneWeb : 440 achetés + 229 d'ici 2034, ~1 Md€ — TheNextWeb / Kratos, 08/2026.\n- Fortastra : 30 M$, Série A menée par First In (Satellite Today, 08/10). Une source (Traded.co) évoque Citi et un autre CEO : erreur probable, ignorer.\n- AST SpaceMobile : -13,59 % le 09/10 (Beinsure).\n- Dans les EchoStar deals : AT&T ~23 Md$ de licences, SpaceX 2,6 Md$ d'AWS-3 (Broadband Breakfast, 12/2025 ; contexte). Le « rachat de licences 800 MHz (09/10) » cité dans le brief n'a PAS été retrouvé : à vérifier.\n\n## Acteurs et positions\n- SpaceX / Musk : Shotwell, Starlink Mobile « could be \"100 times better than what we've got right now\" » (Satellite Today, 07/10). Musk en Inde : accuse les « oligarques ».\n- FCC : approuve ; la dérogation permet d'offrir un service sans accord de bail avec un opérateur mobile ; reporte 2020-2025 MHz, 20,2-21,2 GHz et 30-31 GHz (usage fédéral intense).\n- Opérateurs et concurrents (AST SpaceMobile, AT&T, Verizon, T-Mobile) : subissent la Bourse ; objections passées surtout sur les dérogations EchoStar (Rural Wireless Association, 12/2025). Pas de déclaration d'opérateur trouvée cette semaine.\n- Inde : ministère des Communications dit avoir un cadre « fair and non-discriminatory » ; vérifications de sécurité en cours ; ministre Scindia : Starlink, Jio et OneWeb ont leurs licences. Rahul Gandhi s'empare du sujet contre Modi/Ambani (Onmanorama, 09/10). Rajeev Chandrasekhar : « Patience is a necessity ».\n- Europe : Commission, SpaceRISE (Eutelsat, SES, Hispasat) ; Eutelsat dit que OneWeb « holds its own » et que le principal écart est la couverture mondiale.\n- Fortastra (Mike Smayda, ex-SpaceX, co-fondateur Hermeus) : du modèle « bodyguard » vers la « zone defence ».\n\n## Ce que dit X (citations avec lien)\nPosts non consultés directement. Citations relayées par la presse :\n- Musk, 07/10 : « Unfortunately, we are being blocked by certain oligarchs » — via Gulf News : https://gulfnews.com/technology/dear-prime-minister-ambani-elon-musk-takes-fresh-swipe-over-starlink-row-1.500705161\n- Musk, 09/10 : « Please accept my humble apologies for not realising that you are the real boss of India. » — même lien.\n- Réaction Rahul Gandhi : lien Onmanorama https://www.onmanorama.com/news/business/2026/10/09/musk-questions-ambani-s-clout-rahul-gandhi-joins-in-govt-denies-bias-against-starlink.html (texte non lu).\n- À faire par Arthur : retrouver les posts originaux sur X (réactions à la décision FCC non trouvées).\n\n## Débat et incertitudes\n- Indispensable ≠ intouchable : le levier est réel (refus Crimée 2023), mais l'Inde et la FCC montrent que les États encadrent encore (Starlink attend toujours en Inde).\n- Accusation de Musk sans preuve ; il a pourtant un accord de distribution avec Jio (03/2025) et Airtel : le récit « Ambani bloque » est contesté.\n- Concentration : critiques sur le « monopole LEO » (New Space Economy, 11/04/2026, titre seul lu), Musk aurait lancé l'enquête FCC sur EchoStar par ses plaintes (Broadband Breakfast).\n- Incertitudes : chute des opérateurs (une seule source), statut IPO SpaceX, subscribers divergents, rachat 800 MHz introuvable, chiffres du billet BI inconnus.\n- Contre-argument Europe : 348 satellites en 2029+ vs >10 000 déjà là ; Eutelsat nuance l'écart.\n\n## 3 angles possibles\n1. Thèse : Starlink est une infrastructure souveraine privée, et les États négocient avec Musk comme avec une puissance. Original car relie Ukraine, FCC, Inde dans la même semaine. Faits : dérogation sans bail, Musk vs Ambani, refus Crimée.\n2. Thèse : la vraie bataille est dans votre poche (D2D) : SpaceX devient opérateur mobile, les telcos paient. Original car angle business pour entrepreneurs. Faits : 15 000 sat, -13,6 % AST, Shotwell « 100 times ».\n3. Thèse : l'Europe achète 348 satellites pour 2029 pendant que le marché passe à la défense orbitale. Original par le lien IRIS²/Fortastra. Faits : 66 sat défense, 30 M$, >10 000 vs 348.\n**Angle le plus fort : n°1, car la semaine donne trois démonstrations de pouvoir (FCC, Inde, Europe) sur une seule entreprise. Il faut nuancer par la résistance de l'Inde et par la dépendance de Starlink à ses licences.**\n\n## Munitions\nChiffres : 15 000 satellites autorisés ; 348 satellites IRIS² (2029+) ; ~10,4 Md$ de CA Starlink 2025 ; 1,25 trillion $ de valorisation SpaceX (02/2026) ; -13,59 % pour AST SpaceMobile.\nCitations : « Unfortunately, we are being blocked by certain oligarchs » ; « Please accept my humble apologies for not realising that you are the real boss of India » ; Shotwell « 100 times better than what we've got right now » ; Shotwell, 2022 : « The Pentagon had a $145 million check ready to hand to me, literally » (ancien) ; « Patience is a necessity » (Chandrasekhar).\nDétails surprenants : des satellites à 326-335 km seulement ; SpaceX s'est vu accorder une dérogation pour vendre sans opérateur ; Fortastra a envoyé ses prototypes... à bord d'une fusée SpaceX ; Jio distribue Starlink tout en étant accusé de le bloquer.\n\n## Stock d'articles\n- ⭐ FCC Grants SpaceX Approval for 15,000 Direct-to-Device Satellites — Satellite Today — 📅 07/10 — https://www.satellitetoday.com/connectivity/2026/10/07/fcc-grants-spacex-approval-for-15000-direct-to-device-satellites-in-mss-spectrum/ — détails techniques, Shotwell.\n- ⭐ ‘Dear Prime Minister Ambani’ — Gulf News — 📅 09-10/10 — https://gulfnews.com/technology/dear-prime-minister-ambani-elon-musk-takes-fresh-swipe-over-starlink-row-1.500705161 — citations Musk, réaction Inde.\n- ⭐ Europe's sovereign Starlink rival just went from plan to deployment — TheNextWeb — 📅 08/2026 — https://thenextweb.com/news/iris2-europe-sovereign-satellite-starlink-rival-deployment — IRIS², chiffres.\n- On-Orbit Security Startup Fortastra Raises $30M — Satellite Today — 📅 08/10 — https://www.satellitetoday.com/finance/2026/10/08/on-orbit-security-startup-fortastra-raises-30m-in-series-a/ — Fortastra.\n- AST SpaceMobile stock plunges after SpaceX FCC approval — Beinsure — 📅 09/10 — https://beinsure.com/news/ast-spacemobile-stock-plunges-after-spacex-fcc-approval/ — Bourse.\n- FCC gives final go-ahead for another 15,000 Starlink satellites — Telecoms.com — 📅 non vérifiée (probablement 01/2026, contexte, attention doublon de chiffre) — https://www.telecoms.com/regulation/fcc-gives-final-go-ahead-for-another-15-000-starlink-satellites\n- Musk questions Ambani's clout, Rahul Gandhi joins in — Onmanorama — 📅 09/10 — https://www.onmanorama.com/news/business/2026/10/09/musk-questions-ambani-s-clout-rahul-gandhi-joins-in-govt-denies-bias-against-starlink.html — politique indienne.\n- Musk names Ambani in Starlink row as India rejects bias claims — Light Reading — 📅 ~10/10 — https://lightreading.com/satellite/musk-names-ambani-in-starlink-row-as-india-rejects-bias-claims\n- 3 Things to Know About Starlink Before the 2026 SpaceX IPO — Nasdaq/Motley Fool — 📅 01-02/2026 (contexte) — https://www.nasdaq.com/articles/3-things-know-about-starlink-2026-spacex-ipo — valorisation.\n- FCC Told to Deny or Condition EchoStar Waivers — Broadband Breakfast — 📅 12/2025 (contexte) — https://broadbandbreakfast.com/fcc-told-to-deny-or-condition-echostar-waivers-tied-to-spacex-spectrum-transfer/ — objections.\n- The Starlink monopoly question — New Space Economy — 📅 11/04/2026 (contexte) — https://newspaceeconomy.ca/2026/04/11/the-starlink-monopoly-question-is-spacexs-dominance-over-low-earth-orbit-connectivity-a-market-failure-or-a-market-victory/ — voix critique.\n- Business Insider (brief, non lu) — 📅 11/10 — https://www.businessinsider.com/starlink-elon-musk-business-empire-crown-jewel-2026-10\n"}]};
const md = t => (window.marked ? marked.parse(t.replace(/</g, "&lt;")) : "<pre>" + esc(t) + "</pre>");
function linkify(line) {
  return esc(line).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
async function copyRich(line, btn) {
  const m = line.match(/\[([^\]]+)\]\((https?:[^)]+)\)/);
  const plain = line.replace(/\*\*/g, "").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/, "$1 : $2");
  const html = linkify(line);
  try {
    if (window.ClipboardItem) await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([plain], { type: "text/plain" }) })]);
    else await navigator.clipboard.writeText(plain);
    btn.textContent = "Copié";
  } catch (e) { try { await navigator.clipboard.writeText(plain); btn.textContent = "Copié"; } catch (e2) { btn.textContent = "Copie refusée"; } }
  setTimeout(() => btn.textContent = "Copier", 1500);
}

    ${b.lines.map((l, j) => { const u = (l.match(/\]\((https?:[^)]+)\)/) || [])[1]; return `<div class="bref">${linkify(l)}</div>${u ? linkLine(u) : ""}<button class="small" data-copy="${i}-${j}" type="button">Copier</button>`; }).join("")}
    ${b.note ? `<div class="note">${linkify(b.note)}</div>` : ""}
  </div>`).join("") || '<p class="note">Aucun bref rédigé pour l\'instant.</p>';
document.getElementById("brefs").addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;

});
let qPick = ""; try { qPick = localStorage.getItem(KEY + "-qdj") || ""; } catch (e) {}

    </div>`).join("");
}

for (const a of document.querySelectorAll(".md a")) { a.target = "_blank"; a.rel = "noopener"; }

try { view = localStorage.getItem(KEY + "-view") || (NUM.brefs.length ? "num" : "tri"); } catch (e) {}
